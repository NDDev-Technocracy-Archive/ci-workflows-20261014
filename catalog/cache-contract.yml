# What may be cached, by whom, and where caching must be refused.
#
# Caching in this library used to be whatever each pinned setup action does by
# default. That made the safe properties true by accident: `release.yml` disables
# the uv cache for a good reason written in a comment, and nothing stopped a
# later edit from dropping it. GitHub's Actions cache is ref-scoped with
# default-branch fallback and a pull request reads the merge ref, so a cache
# entry is an unreviewed input, not signed provenance -- which is exactly why the
# refusals below have to be enforced rather than remembered.
#
# `check_cache_contract.py` compiles this fail-closed: an action that can cache
# and is not listed here fails the gate, so a new caching dependency has to be
# classified rather than inherited.
schema_version: 2

trust:
  namespace: repository
  pull_request_scope: merge-ref
  default_branch_fallback: read-only
  low_trust_default_branch_access: restore-only
  trusted_default_branch_writers:
    - push
    - workflow_dispatch
    - repository_dispatch
    - delete
    - registry_package
    - page_build
    - schedule
  cache_is_provenance: false
  secrets_allowed: false

keys:
  match: exact-first
  prefix_restore: explicit-review-only
  cross_os_archive_default: false
  required_dimensions:
    - repository
    - operating-system
    - architecture
    - tool-or-action-version
    - dependency-input-digest
  conditional_dimensions:
    - target-platform
    - build-settings
    - private-backend-identity

persistent_runners:
  workspace_reuse: forbidden
  mutable_cross_job_state: forbidden
  allowed_warm_state:
    - immutable-runner-image
    - checksum-verified-tool-store
    - typed-tenant-scoped-cache-backend
  cleanup_authority: runner-lifecycle
  residue_is_trusted_input: false

retention:
  idle_eviction_days: 7
  default_repository_limit_gb: 10
  eviction_order: least-recently-accessed
  upload_rate_per_minute: 200
  download_rate_per_minute: 1500
  cache_miss_correctness_effect: none

equivalence:
  hosted_and_fleet_keys_share_semantics: true
  backend_identity_required_for_private_cache: true
  hit_is_authoritative_evidence: false
  miss_may_fail_job: false
  corrupt_entry_action: discard-and-rebuild

telemetry:
  required:
    - backend
    - key-digest
    - hit
    - restore-duration
    - save-duration
    - restored-bytes
    - saved-bytes
  compare:
    - cold
    - warm
  synthetic_load_allowed: false

# Every action in the tree that can write to a cache, the input that decides
# whether it does, and what happens with no input at all.
#
# `upstream_default` is the literal default declared by the pinned action's own
# `action.yml`, and `check_cache_upstream_defaults.py` resolves it from that file
# every sweep. It used to be prose: `astral-sh/setup-uv` was recorded as not
# caching by default when the pinned action declares `auto`, and `auto` resolves
# to true on a GitHub-hosted runner. So the contract asserted the opposite of the
# behaviour, and nothing executed the assertion.
#
# `default_caches` is the effective behaviour on the runners this library targets.
# Some actions cache by construction (`actions/cache`, ccache); others enable
# caching by default. The entries below state each pinned action's behavior.
producers:
  - action: actions/cache
    control: null
    upstream_default: null
    default_caches: true
    note: Explicit cache; the key is written by the calling workflow.
  - action: docker/build-push-action
    control: cache-to
    upstream_default: null
    default_caches: false
    note: >-
      Caches only when docker-build.yml passes cache-from/cache-to, and the
      workflow computes them from its `cache` input: a registry ref
      ({image}/buildcache by default) or type=gha. No input means no cache.
  - action: astral-sh/setup-uv
    control: enable-cache
    upstream_default: auto
    default_caches: true
    note: >-
      `auto` in the pinned action.yml, and its `getEnableCache()` returns true
      when RUNNER_ENVIRONMENT is `github-hosted`. Recorded as caching by default
      because that is what it does on the runners this library targets. This was
      recorded as `false` and believed for long enough that two gate jobs carried
      a comment saying the input changed nothing today.
  - action: actions/setup-go
    control: cache
    upstream_default: true
    default_caches: true
    note: Caches the module and build cache unless asked not to.
  - action: actions-rust-lang/setup-rust-toolchain
    control: cache
    upstream_default: "true"
    default_caches: true
    note: >-
      The pinned composite action enables Rust cache by default. The native
      cargo-deny job explicitly refuses it; audit, machete and compilation
      callers retain their existing cache policy.
  - action: actions/setup-java
    control: cache
    upstream_default: null
    default_caches: false
    note: No default declared, so an absent input caches nothing.
  - action: actions/setup-node
    control: cache
    upstream_default: null
    default_caches: false
    note: No default declared, so an absent input caches nothing.
  - action: actions/setup-python
    control: cache
    upstream_default: null
    default_caches: false
    note: No default declared, so an absent input caches nothing.
  - action: gradle/actions/setup-gradle
    control: cache-provider
    upstream_default: enhanced
    default_caches: true
    note: >-
      The input selects a provider rather than switching caching off; a provider
      is always chosen, so caching happens unless disabled by other means.
  - action: hendrikmuhs/ccache-action
    control: null
    upstream_default: null
    default_caches: true
    note: A cache action by construction; callers opt in by adding the step.
  - action: NDDev-Technocracy-OpenNetwork/ci-workflows/actions/tool-cache
    control: null
    upstream_default: null
    default_caches: false
    note: >-
      Vendored from NDDev-Archive/github-actions-garm/actions/tool-cache
      468af475 and addressed by this repository's own name: a called workflow
      cannot reach its vendored actions through `./`, which resolves against
      the caller's workspace. Cache use is conditional on a complete per-job Drakkars
      assignment. GitHub-hosted runners and malformed or unavailable
      assignments use the checksum-verified upstream path; private writes
      remain inside the caller's injected trust prefix.

# Where a cache must be refused, and why. Each rule names the exact input and
# value the workflow has to carry; the check fails if the step is missing it.
refusals:
  - workflow: .github/workflows/rust-supply-chain.yml
    job: deny
    action: actions-rust-lang/setup-rust-toolchain
    input: cache
    value: false
    reason: Metadata and policy scanning do not need a shared compilation cache.
  - workflow: .github/workflows/release.yml
    job: resolve
    action: astral-sh/setup-uv
    input: enable-cache
    value: false
    reason: >-
      A publishing workflow must not take an unreviewed input. A cache entry
      written from a lower-trust ref would be restored into a release build
      (zizmor cache-poisoning, high). The preflight installs one hash-pinned
      wheel, so the cache saves nothing worth that exposure.
  - workflow: .github/workflows/public-codeql.yml
    job: codeql
    action: actions/setup-go
    input: cache
    value: false
    reason: >-
      setup-go caches by default. CodeQL analyses the build it observes, and a
      restored build cache lets compilation be skipped, so the analysis would
      cover less than it appears to.
  - workflow: .github/workflows/ci.yml
    job: validate
    action: astral-sh/setup-uv
    input: enable-cache
    value: false
    reason: The self-CI aggregate must not depend on an unreviewed input.
  - workflow: .github/workflows/ci.yml
    job: validate-touched
    action: astral-sh/setup-uv
    input: enable-cache
    value: false
    reason: The self-CI aggregate must not depend on an unreviewed input.
  - workflow: .github/workflows/ci.yml
    job: shell-gates
    action: astral-sh/setup-uv
    input: enable-cache
    value: false
    reason: The self-CI aggregate must not depend on an unreviewed input.
  - workflow: .github/workflows/ci.yml
    job: dockerfile-gate
    action: astral-sh/setup-uv
    input: enable-cache
    value: false
    reason: The self-CI aggregate must not depend on an unreviewed input.
  - workflow: .github/workflows/ci.yml
    job: shell-gates
    action: actions/setup-go
    input: cache
    value: false
    reason: >-
      setup-go caches the module and build cache with no input at all, and this
      job is in `ci-gate.needs`. Found by deriving the aggregate surface from
      the gate's own graph; the hand-written list had not named it.
  - workflow: .github/workflows/zizmor-sarif.yml
    job: zizmor
    action: astral-sh/setup-uv
    input: enable-cache
    value: false
    reason: >-
      This workflow backs the `zizmor` job, which is in `ci-gate.needs`. The
      contract's own closing paragraph used to assert that the undeclared
      remainder could not reach the aggregate; this is the counter-example.

# Everything else is left to the producer's default on purpose, and there is now
# exactly one such place: `python-ci.yml`, which sets `enable-cache: true`
# deliberately -- it caches the consumer's own dependencies, which is the point of
# the workflow.
#
# The previous version of this paragraph said the remainder were "advisory lanes
# where a poisoned entry cannot reach a release or a required check". That was
# false: `zizmor-sarif.yml` is called by the `zizmor` job, which is in
# `ci-gate.needs`, and it took setup-uv's default. The refusals below are no
# longer a hand-written list -- `check_cache_contract.py` derives the aggregate
# jobs from `ci-gate`'s own `needs` graph, follows local `uses:` into the called
# workflow, and demands a refusal for every cache-capable step it finds there.

  - id: nddev-security-bundle
    name: Consolidated private security bundle
    cluster: security-scanning
    status: preview
    public_oss: unavailable
    private_free: unavailable
    private_paid: available
    workflow: .github/workflows/nddev-security-bundle.yml
    example: examples/private-paid-ghas/security-selfhosted.yml
    required_permissions:
      - "actions: read"
      - "contents: read"
      - "security-events: write"
    required_settings:
      - "Linux X64 ephemeral private runner"
    risks:
      - "Private repositories only; a public fork must never reach a self-hosted runner"
      - "Requires GitHub Code Security because zizmor SARIF upload is preserved; private-free callers keep the no-SARIF workflows"
      - "Four gates share one failure domain, but the script executes and summarizes every gate before returning failure"
      - "Artifact upload failure requires a complete bounded redacted ZIP with SHA-256 and run identity in the run log; failure of both transports fails the job"
      - "The called workflow fetches its implementation from job.workflow_repository at exact job.workflow_sha into a fresh invocation-specific directory outside the caller workspace"
      - "Selected Git history is materialized with process-only authentication before Gitleaks; unavailable objects fail the scan"
      - "Downloaded actionlint, OSV-Scanner, and gitleaks artifacts are checksum-pinned; zizmor is uvx version-pinned"
    deprecations: null
    last_verified: "2026-08-21"
    sources:
      - "https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#job-context"
      - "https://github.com/rhysd/actionlint"
      - "https://github.com/woodruffw/zizmor"
      - "https://github.com/google/osv-scanner"
      - "https://github.com/gitleaks/gitleaks"

  - id: private-security-bundle-free
    name: Consolidated private-free security bundle
    cluster: security-scanning
    status: preview
    public_oss: unavailable
    private_free: free
    private_paid: available
    workflow: .github/workflows/private-security-bundle-free.yml
    example: examples/private-free/security-selfhosted.yml
    required_permissions:
      - "contents: read"
    required_settings:
      - "Linux X64 ephemeral private runner"
    risks:
      - "Private repositories only; public forks must never reach self-hosted capacity"
      - "SARIF remains an artifact rather than a code-scanning upload because private-free repositories have no security-events entitlement"
      - "Four gates share one failure domain, but every gate executes before aggregate failure"
      - "Optional check_name preserves the inner job display name during required-check migration; caller prefix and scanner enforcement remain separate"
      - "Called-workflow implementation is fetched at exact job.workflow_sha into a fresh invocation-specific directory outside the caller workspace"
      - "Selected Git history is materialized with process-only authentication before Gitleaks; unavailable objects fail the scan"
      - "Submodule worktrees survive caller checkout on reused runners, so the workflow puts each declared path in a known state before scanning: pinned at its gitlink via the optional submodule_deploy_keys secret, or emptied when no key is supplied"
      - "Gitleaks evidence is fully redacted before the one-day artifact upload; a failed upload requires a complete bounded ZIP with SHA-256 and run identity in the run log"
      - "The tool-cache action is vendored at actions/tool-cache from NDDev-Archive/github-actions-garm 468af475; an archived dependency cannot receive fixes, so the live copy lives beside the workflow that runs it"
      - "The workflow pins its vendored tool-cache action independently; adopting a new workflow revision activates a downloader fix only when that inner action pin also advances"
    deprecations: null
    last_verified: "2026-08-22"
    sources:
      - "https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#job-context"
      - "https://github.com/rhysd/actionlint"
      - "https://github.com/woodruffw/zizmor"
      - "https://github.com/google/osv-scanner"
      - "https://github.com/gitleaks/gitleaks"


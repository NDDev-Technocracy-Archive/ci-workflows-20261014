# ci-workflows capability catalog
# Machine-readable source of truth. Mirrored by docs/. Enforced by scripts/validate_catalog.py.
# Schema and enums are documented in catalog/README.md.
# Last verified: 2026-07-04
#
# workflow: paths use the FINAL canonical inventory. Capabilities whose delivering
# workflow file is not yet present on disk (or whose platform feature is not yet GA)
# carry status: planned or status: preview. See catalog/README.md for the naming note
# on the zizmor SARIF/no-SARIF split.

capabilities:
  - id: codeql-code-scanning
    name: CodeQL code scanning
    cluster: security-scanning
    status: ga
    public_oss: free
    private_free: unavailable
    private_paid: available
    workflow: .github/workflows/public-codeql.yml
    example: null
    required_permissions:
      - "actions: read"
      - "contents: read"
      - "security-events: write"
    required_settings:
      - "Code scanning enabled"
      - "GitHub Advanced Security enabled (required on private repos)"
      - "Dependabot pull requests use the reviewed dependabot_runner trust boundary"
    risks:
      - "Paid via GHAS on private repositories; keep upload disabled there"
      - "Language autobuild can fail on compiled languages without a build spec"
      - "Dependabot pull_request events have read-only tokens and no Actions secrets; use pull_request, never pull_request_target, and keep checkout credentials disabled"
    deprecations: null
    last_verified: "2026-08-23"
    sources:
      - "https://docs.github.com/en/code-security/code-scanning/introduction-to-code-scanning/about-code-scanning-with-codeql"
      - "https://github.com/github/codeql-action"
      - "https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-on-actions"
      - "https://docs.github.com/en/code-security/reference/code-scanning/troubleshoot-analysis-errors/resource-not-accessible"

  - id: github-code-quality
    name: GitHub Code Quality
    product_facts:
      - github-code-quality-transition
    cluster: security-scanning
    status: ga
    public_oss: paid
    private_free: paid
    private_paid: available
    workflow: null
    example: null
    required_permissions: []
    required_settings:
      - "Team or Enterprise Cloud plan"
      - "Enterprise owner allows Code Quality at the enterprise level"
      - "Organization Settings -> Security -> Code quality -> Repository access scoped to the paid-tier repositories"
      - "GitHub Actions enabled on the repository (scans run as Actions workflows)"
      - "Optional PR gate: ruleset rule 'Require code quality results' with a severity threshold"
    risks:
      - "The public per-committer rate is disputed between GitHub's own sources: the product page states $0 for public repositories, the billing docs grant no visibility exemption. Never compile a public cost from this capability in either direction; treat it as account-observed"
      - "Committers are counted once per organization, so enabling a single repository already bills the whole active committer set"
      - "Scans consume Actions minutes on private repositories; AI-assisted detection and Autofix consume AI credits"
      - "Ships no Action and no workflow_call entrypoint, so this library pins nothing for it; a REST API does exist (GET/PATCH /repos/{owner}/{repo}/code-quality/setup plus findings), so its state is drift-checkable by the estate reconciler, not from here"
      - "Its check runs are named 'Analyze (<language>)', identical to CodeQL default setup, which runs from the same dynamic/github-code-scanning/codeql path; only the run name differs, so a required status check on that name cannot distinguish maintainability from security"
      - "Requiring code quality results blocks merges while analysis is still running or when it fails, e.g. on exhausted Actions minutes"
    deprecations: null
    last_verified: "2026-08-10"
    sources:
      - "https://docs.github.com/en/code-security/concepts/about-code-quality"
      - "https://docs.github.com/en/code-security/how-tos/maintain-quality-code/enable-code-quality"
      - "https://docs.github.com/en/code-security/how-tos/maintain-quality-code/set-pr-thresholds"
      - "https://docs.github.com/en/billing/concepts/product-billing/github-code-quality"
      - "https://docs.github.com/en/rest/code-quality/code-quality"
      - "https://github.com/features/code-quality"


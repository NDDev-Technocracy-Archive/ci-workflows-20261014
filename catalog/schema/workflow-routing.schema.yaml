$schema: https://json-schema.org/draft/2020-12/schema
$id: https://github.com/NDDev-Technocracy-OpenNetwork/ci-workflows/catalog/schema/workflow-routing.schema.yaml
title: ci-workflows reusable workflow routing contract
type: object
additionalProperties: false
required: [schema, platforms, runtime_requirements, groups]
properties:
  schema:
    const: nddev-ci-workflow-routing/v1
  platforms:
    type: array
    uniqueItems: true
    items: { enum: [linux, macos, windows] }
  runtime_requirements:
    type: array
    uniqueItems: true
    items: { enum: [container-runtime] }
  groups:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, supported_os, runtime_requirements, workflows]
      properties:
        id:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        supported_os:
          type: array
          minItems: 1
          uniqueItems: true
          items: { enum: [linux, macos, windows] }
        runtime_requirements:
          type: array
          uniqueItems: true
          items: { enum: [container-runtime] }
        workflows:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            pattern: ^\.github/workflows/[^/]+\.ya?ml$

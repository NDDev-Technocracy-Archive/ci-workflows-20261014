- id: github-code-quality-transition
  provider: GitHub
  product: Code Quality
  surface: quality
  repository_visibility:
  - public
  - private
  - internal
  plans:
  - Team
  - Enterprise Cloud
  model: scheduled-paid-transition
  allowance:
    value: 10
    unit: usd-per-active-committer
    period: month
    multipliers: {}
  conditions:
  - Public preview before 2026-07-20
  - GA and paid from 2026-07-20
  - 'DISPUTED — the public per-committer rate is not settled between GitHub''s own sources. The product
    page states "Public repositories: $0 per committer + usage-based billing for AI-powered work"; the
    billing documentation states only that "each active committer uses one Code Quality license", with
    no visibility exemption and no rate. Do not compile a public per-committer cost from this fact:
    treat it as account-observed until NDDev Licensing/Billing or an invoice resolves it. The $10
    private rate and the Team/Enterprise plan gate are undisputed.'
  - Active committers are counted once per organization across every repository with Code Quality enabled
  - A committer is active if one of their commits was pushed in the last 90 days, regardless of authoring date
  - Bot accounts are not billed
  - Licence is independent of Code Security / Secret Protection; Advanced Security does not include it
  - AI capabilities add usage charges
  - Deterministic CodeQL analysis consumes Actions minutes
  - Scope with the org-level Repository access control (all / selected / no repositories) to choose which repositories bill
  payment_method: required-from-2026-07-20
  overage: AI usage and Actions minutes may add cost
  status: official
  source_authority: primary
  verified_at: '2026-08-01'
  expires_after: '2026-10-21'
  source_urls:
  - https://github.blog/changelog/2026-06-16-github-code-quality-generally-available-july-20-2026/
  - https://docs.github.com/en/billing/concepts/product-billing/github-code-quality
  - https://docs.github.com/en/code-security/how-tos/maintain-quality-code/enable-code-quality
  - https://docs.github.com/en/code-security/how-tos/maintain-quality-code/disable-code-quality
  notes:
  - 'GA + paid transition completed 2026-07-20 as scheduled; no longer time-critical.'
  - 'Re-verified 2026-07-21 against the billing docs: standalone per-active-committer license ($10/active committer/month), CodeQL scans consume Actions minutes, AI features consume AI credits at $0.01/credit, independent of Advanced Security licenses; Team + Enterprise Cloud.'
  - 'Re-verified 2026-08-01: visibility does not gate the licence REQUIREMENT — a public repository still consumes one Code Quality licence per active committer, and only avoids the Actions-minutes component (standard runners are unmetered on public). That is why the tier docs exclude Code Quality from both free tiers instead of folding it into the public tier. This note does NOT settle the public RATE and must not be read as overriding the DISPUTED condition above. An earlier revision said flatly that public repositories are not free, README compiled that into a headline claim, and the dispute recorded in the same fact was quietly resolved in prose. State the licence requirement; leave the rate account-observed.'

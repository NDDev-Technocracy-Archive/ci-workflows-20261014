# Gitleaks over this repository's own history. Named gitleaks.yml because
# secret-scan.yml is the reusable definition itself.
name: gitleaks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  gitleaks:
    permissions:
      contents: read
    uses: ./.github/workflows/secret-scan.yml  # zizmor: ignore[self-repository]
    with:
      runner: ubuntu-latest
      # Preserve history/version while avoiding the same Docker Hub pull
      # rate limit that can prevent dependency checks from starting.
      execution_mode: binary

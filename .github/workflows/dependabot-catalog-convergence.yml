name: dependabot-catalog-convergence

on:
  # `workflow_run` supplies a default-branch workflow and write token. This job
  # accepts only a failed same-repository PR run by dependabot[bot], never
  # executes candidate files, and runs the synchronizer from a separate trusted
  # default-branch checkout. The candidate is only a Git output worktree.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [ci]
    types: [completed]

permissions: {}

concurrency:
  group: dependabot-catalog-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  synchronize:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    permissions:
      actions: write # approve only runs created for the exact derived candidate SHA
      contents: write # push the derived catalog commit to the same Dependabot branch
      pull-requests: write # update the bound Dependabot PR branch before deriving output
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - name: Checkout trusted generator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          path: trusted
      - name: Update bound Dependabot pull request branch
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          pr_json="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=open&head=${owner}:${HEAD_BRANCH}")"
          pr_number="$(jq -er 'if length == 1 then .[0].number else error("expected exactly one bound pull request") end' <<<"$pr_json")"
          current_head="$(jq -er '.[0].head.sha' <<<"$pr_json")"
          if [ "$current_head" != "$EXPECTED_HEAD_SHA" ]; then
            echo "workflow_run head no longer matches bound pull request" >&2
            exit 1
          fi
          response="$(gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}/update-branch" -f "expected_head_sha=${current_head}" 2>&1)" || {
            if grep -Eq 'already up to date|no new commits' <<<"$response"; then
              # A branch that is already current is success, not failure;
              # the poll below must not wait on an update that never ran.
              response="already up to date"
            else
              printf '%s\n' "$response" >&2
              exit 1
            fi
          }
          for _ in $(seq 1 30); do
            updated_head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" --jq .head.sha)"
            if [ "$updated_head" != "$current_head" ] || grep -Fq 'already up to date' <<<"$response"; then
              printf 'pr_number=%s\n' "$pr_number" >>"$GITHUB_OUTPUT"
              printf 'updated_head=%s\n' "$updated_head" >>"$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 2
          done
          echo "timed out waiting for update-branch" >&2
          exit 1
      - name: Checkout Dependabot branch as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          persist-credentials: true
          path: candidate
      - name: Set up Python
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          update-environment: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: 0.11.30
          enable-cache: false
      - name: Build trusted tool environment
        env:
          PYTHON_PATH: ${{ steps.python.outputs.python-path }}
        run: |
          "$PYTHON_PATH" -I -B -m venv --copies trusted/.venv
          uv pip install --python trusted/.venv/bin/python --require-hashes -r trusted/requirements-ci.txt
      - name: Synchronize derived action declarations
        run: >-
          trusted/.venv/bin/python -I -B
          trusted/scripts/check_python_execution_contract.py
          --launch sync_action_catalog.py -- --root candidate --catalog-only
      - name: Commit converged declarations
        id: commit
        working-directory: candidate
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          # GITHUB_TOKEN cannot push workflow-file updates without the
          # `workflows` permission. Dependabot already owns those files; this
          # job only commits catalog and generated docs derived from them.
          # sync_action_catalog.py --catalog-only requires a unique pin per
          # action across workflow files and fails closed on mixed identities.
          if git diff --quiet -- catalog docs/generated; then
            echo "catalog already converged"
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add catalog docs/generated
            git commit -m "chore(deps): synchronize action catalog"
          fi
          git push origin "HEAD:${HEAD_BRANCH}"
          printf 'candidate_sha=%s\n' "$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
      - name: Approve exact candidate workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.commit.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          seen=false
          for _ in $(seq 1 30); do
            runs="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?event=pull_request&head_sha=${CANDIDATE_SHA}")"
            count="$(jq '[.workflow_runs[]] | length' <<<"$runs")"
            if [ "$count" -gt 0 ]; then seen=true; fi
            mapfile -t pending < <(jq -r '.workflow_runs[] | select(.status == "action_required") | .id' <<<"$runs")
            for run_id in "${pending[@]}"; do
              gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/approve" >/dev/null
            done
            if [ "$seen" = true ] && [ "${#pending[@]}" -eq 0 ]; then
              exit 0
            fi
            sleep 2
          done
          echo "timed out approving candidate workflow runs" >&2
          exit 1

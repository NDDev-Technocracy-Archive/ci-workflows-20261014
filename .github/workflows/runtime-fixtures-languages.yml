name: runtime-fixtures-languages

# The consumer fixture estate. This is what `catalog/runtime-coverage.yml` has
# been honest about not having.
#
# Static validation proves the contracts hold in the tree. It cannot prove a
# reusable workflow *starts* — that its `workflow_call` interface resolves, that
# its permissions are sufficient, that its downloads and checksums work on a real
# runner. ADR 0003 says so plainly: "The fixture estate that would supply real
# proof is still absent." Two of forty-six workflows were runtime-proven, and
# both only because this repository happened to call them for its own sake.
#
# So this workflow calls them deliberately, as a consumer would, with the same
# safe inputs a consumer would pass. Each successful job is real evidence for one
# reusable, and its run URL plus the workflow's sha256 go into the ledger.
#
# Deliberately NOT a required check and deliberately not on `pull_request`:
# evidence production is not merge gating, and running the whole estate on every
# pull request would be a cost this buys nothing back. `ci-gate` does not depend
# on it.
#
# Triggers: a push to `fixtures/**` produces evidence on demand (workflow_dispatch
# only works from the default branch, which is no use while proving a change);
# the weekly schedule keeps evidence from going stale as pins move.
#
# Every call names `runner: ubuntu-latest` explicitly. These reusables default to
# a private self-hosted label, and a default belongs to the pinned commit, not to
# the caller — the same rule every example here follows.

on:
  push:
    branches: ['fixtures/**']
  schedule:
    # Sundays 04:00 UTC — well clear of the Monday Dependabot and maintenance
    # windows, so a failure here is not confused with a pin bump.
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  fixture-go-ci:
    name: fixture / go-ci
    permissions:
      contents: read
    uses: ./.github/workflows/go-ci.yml
    with:
      runner: ubuntu-latest
      working_directory: tests/fixtures/go

  # supporting — Python lane. test_command is required by the contract, so this
  # also proves the required-input path.
  fixture-python-ci:
    name: fixture / python-ci
    permissions:
      contents: read
    uses: ./.github/workflows/python-ci.yml
    with:
      runner: ubuntu-latest
      working_directory: tests/fixtures/python
      # No --system: the workflow now activates a uv venv on the requested
      # interpreter, and --system would push the install back onto the runner's
      # externally-managed system Python, which is what failed the first run.
      install_command: "uv pip install -e . pytest"
      test_command: "python -m pytest -q"

  fixture-python-pip:
    name: fixture / python-ci / pip
    permissions:
      contents: read
    uses: ./.github/workflows/python-ci.yml
    with:
      runner: ubuntu-latest
      package_manager: pip
      python_version: '3.13'
      cache: pip
      cache_dependency_path: tests/fixtures/python/pyproject.toml
      working_directory: tests/fixtures/python
      install_command: 'python -m pip install -e . pytest'
      test_command: 'python -m pytest -q'

  # supporting — Node lane under bun.
  fixture-node-ci:
    name: fixture / node-ci
    permissions:
      contents: read
    uses: ./.github/workflows/node-ci.yml
    with:
      runner: ubuntu-latest
      working_directory: tests/fixtures/node
      test_command: "bun test"

  fixture-node-package-managers:
    name: fixture / node-ci / ${{ matrix.package_manager }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package_manager: npm
            cache: ''
            cache_dependency_path: ''
            test_command: '[[ "$(node --version)" == "v24.19.0" ]] && [[ "$(npm --version)" == "11.17.0" ]]'
          - package_manager: pnpm
            cache: ''
            cache_dependency_path: ''
            test_command: '[[ "$(node --version)" == "v24.19.0" ]] && [[ "$(pnpm --version)" == "11.22.0" ]]'
          - package_manager: yarn
            cache: ''
            cache_dependency_path: ''
            test_command: '[[ "$(node --version)" == "v24.19.0" ]] && [[ "$(yarn --version)" == "4.18.0" ]]'
    permissions:
      contents: read
    uses: ./.github/workflows/node-ci.yml
    with:
      runner: ubuntu-latest
      package_manager: ${{ matrix.package_manager }}
      cache: ${{ matrix.cache }}
      cache_dependency_path: ${{ matrix.cache_dependency_path }}
      working_directory: tests/fixtures/node
      install_command: ':'
      test_command: ${{ matrix.test_command }}

  # supporting — Rust build/test/fmt/clippy lanes. The fixture ships a
  # hand-written Cargo.lock so the default `--locked` commands are exercised as
  # written rather than relaxed for the fixture's convenience.
  fixture-rust-ci:
    name: fixture / rust-ci
    permissions:
      contents: read
    uses: ./.github/workflows/rust-ci.yml
    with:
      runner: ubuntu-latest
      working_directory: tests/fixtures/rust
      fmt_command: "cargo fmt --all -- --check"
      clippy_command: "cargo clippy --locked --all-targets -- -D warnings"

  # supporting — C++ configure/build/test lanes through CMake and ctest.
  fixture-cpp-ci:
    name: fixture / cpp-ci
    permissions:
      contents: read
    uses: ./.github/workflows/cpp-ci.yml
    with:
      runner: ubuntu-latest
      working_directory: tests/fixtures/cpp

  # supporting — Terraform fmt/init/validate. The fixture declares no provider,
  # so init stays offline and the lane cannot fail on a registry outage.
  fixture-terraform-ci:
    name: fixture / terraform-ci
    permissions:
      contents: read
    uses: ./.github/workflows/terraform-ci.yml
    with:
      runner: ubuntu-latest
      working_directory: tests/fixtures/terraform

  # supporting — sqlfluff lint on the ansi dialect.
  fixture-sql-ci:
    name: fixture / sql-ci
    permissions:
      contents: read
    uses: ./.github/workflows/sql-ci.yml
    with:
      runner: ubuntu-latest
      working_directory: tests/fixtures/sql

  # supporting — the three docs lanes at once: lychee, typos and markdownlint.
  # The fixture's only link is relative and committed alongside it, so the link
  # checker cannot fail on someone else's outage.
  fixture-docs-quality:
    name: fixture / docs-quality
    permissions:
      contents: read
    uses: ./.github/workflows/docs-quality.yml
    with:
      runner: ubuntu-latest
      # Repo-root-relative on purpose — see the scope note in docs-quality.yml.
      # The first run of this fixture set working_directory alone and scanned
      # the whole repository, failing on "NDDev" in docs/02. That is what these
      # three explicit paths exist to prevent.
      typos_files: tests/fixtures/docs
      markdownlint_globs: tests/fixtures/docs/**/*.md
      lychee_args: '--no-progress --max-concurrency 8 "tests/fixtures/docs/**/*.md"'

  # supporting — hadolint against a Dockerfile that is clean at the default
  # `warning` threshold: digest-pinned base, pinned package version, non-root.
  fixture-hadolint:
    name: fixture / hadolint-ci
    permissions:
      contents: read
    uses: ./.github/workflows/hadolint-ci.yml
    with:
      runner: ubuntu-latest
      dockerfile: tests/fixtures/docker/Dockerfile

  # supporting — stylelint and htmlhint. The fixture carries its own
  # .stylelintrc.json because stylelint hard-errors without a configuration,
  # which the default lint command otherwise hides behind a working directory.
  fixture-web-ci:
    name: fixture / web-ci
    permissions:
      contents: read
    uses: ./.github/workflows/web-ci.yml
    with:
      runner: ubuntu-latest
      working_directory: tests/fixtures/web

  # supporting — Trivy filesystem scan, pointed at the fixture estate rather
  # than the whole repository so the lane is fast and its subject is stable.
  fixture-container-ci:
    name: fixture / container-ci
    permissions:
      contents: read
    uses: ./.github/workflows/container-ci.yml
    with:
      runner: ubuntu-latest
      scan_type: fs
      scan_ref: tests/fixtures

  # supporting — the three-OS matrix. Standard hosted runners are unmetered on
  # public repositories in all three operating systems, so proving the macOS and
  # Windows lanes here costs nothing; on a private repository this same job
  # would bill macOS at 10.33x, which is why the record notes the tier.
  fixture-cross-platform-smoke:
    name: fixture / cross-platform-smoke
    permissions:
      contents: read
    uses: ./.github/workflows/cross-platform-smoke.yml


  # supporting — Maven compile and package. The POM declares no test dependency,
  # so `mvn -B verify` runs the default lifecycle without resolving an artifact
  # tree; a JUnit dependency would make this a Maven Central availability test.
  fixture-java-ci:
    name: fixture / java-ci
    permissions:
      contents: read
    uses: ./.github/workflows/java-ci.yml
    with:
      runner: ubuntu-latest
      working_directory: tests/fixtures/java

  # supporting — the .NET restore, build and run lanes. test_command is
  # overridden to `dotnet run` because the fixture is a console app: a real test
  # project would need the test SDK plus a framework package, and the point here
  # is the workflow's plumbing, not NuGet's.
  fixture-dotnet-ci:
    name: fixture / dotnet-ci
    permissions:
      contents: read
    uses: ./.github/workflows/dotnet-ci.yml
    with:
      runner: ubuntu-latest
      working_directory: tests/fixtures/dotnet
      test_command: "dotnet run --no-build --configuration Release"

  # supporting — swift build and swift test on macOS. XCTest ships with the
  # toolchain, so the package resolves nothing. This runs on macos-latest, which
  # is a standard hosted runner and therefore unmetered here; the same job on a
  # private repository would bill at 10.33x Linux.
  fixture-swift-ci:
    name: fixture / swift-ci
    permissions:
      contents: read
    uses: ./.github/workflows/swift-ci.yml
    with:
      # Explicit even though it equals the reusable's default: the contract is
      # that a public caller states its runner rather than inheriting one that
      # could change under it.
      runner: macos-latest
      working_directory: tests/fixtures/swift


  # --- Three-operating-system lanes -----------------------------------------
  # Every reusable above exposes a `runner` input, which is a promise that a
  # consumer may pick their operating system. Until now that promise was only
  # ever tested on Linux. Standard hosted runners are unmetered on public
  # repositories in all three, so testing the promise here costs nothing and
  # catches the class of defect that only appears off Linux: path separators,
  # the shell git-bash provides on Windows, and toolchain availability.
  #
  # The Linux lane already runs above; these add macOS and Windows.

  fixture-go-ci-os:
    name: fixture / go-ci
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    permissions:
      contents: read
    uses: ./.github/workflows/go-ci.yml
    with:
      runner: ${{ matrix.os }}
      working_directory: tests/fixtures/go

  fixture-python-ci-os:
    name: fixture / python-ci
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    permissions:
      contents: read
    uses: ./.github/workflows/python-ci.yml
    with:
      runner: ${{ matrix.os }}
      working_directory: tests/fixtures/python
      install_command: "uv pip install -e . pytest"
      test_command: "python -m pytest -q"

  fixture-rust-ci-os:
    name: fixture / rust-ci
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    permissions:
      contents: read
    uses: ./.github/workflows/rust-ci.yml
    with:
      runner: ${{ matrix.os }}
      working_directory: tests/fixtures/rust

  fixture-dotnet-ci-os:
    name: fixture / dotnet-ci
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    permissions:
      contents: read
    uses: ./.github/workflows/dotnet-ci.yml
    with:
      runner: ${{ matrix.os }}
      working_directory: tests/fixtures/dotnet
      test_command: "dotnet run --no-build --configuration Release"

  fixture-java-ci-os:
    name: fixture / java-ci
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    permissions:
      contents: read
    uses: ./.github/workflows/java-ci.yml
    with:
      runner: ${{ matrix.os }}
      working_directory: tests/fixtures/java

  fixture-node-ci-os:
    name: fixture / node-ci
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    permissions:
      contents: read
    uses: ./.github/workflows/node-ci.yml
    with:
      runner: ${{ matrix.os }}
      working_directory: tests/fixtures/node
      test_command: "bun test"

  fixture-terraform-ci-os:
    name: fixture / terraform-ci
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    permissions:
      contents: read
    uses: ./.github/workflows/terraform-ci.yml
    with:
      runner: ${{ matrix.os }}
      working_directory: tests/fixtures/terraform

  fixture-sql-ci-os:
    name: fixture / sql-ci
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    permissions:
      contents: read
    uses: ./.github/workflows/sql-ci.yml
    with:
      runner: ${{ matrix.os }}
      working_directory: tests/fixtures/sql

  fixture-web-ci-os:
    name: fixture / web-ci
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    permissions:
      contents: read
    uses: ./.github/workflows/web-ci.yml
    with:
      runner: ${{ matrix.os }}
      working_directory: tests/fixtures/web

  # promoting a record. Never required; this is a report, not a gate.
  fixture-benchmark-compare:
    name: fixture / benchmark-compare
    permissions:
      contents: read
    uses: ./.github/workflows/benchmark-compare.yml
    with:
      runner: ubuntu-latest
      language: go
      working_directory: tests/fixtures/go
      bench_command: "go test -bench=. -benchmem -run=XXX_no_tests ./... | tee output.txt"
      tool: go
      output_file_path: tests/fixtures/go/output.txt
      external_data_json_path: tests/fixtures/go/benchmark-data.json
      fail_on_alert: false

  # supporting — R lane. use_public_rspm (the default) serves precompiled
  # supporting — R lane. use_public_rspm (the default) serves precompiled
  # binaries, so installing testthat is a download rather than a compile.
  fixture-r-ci:
    name: fixture / r-ci
    permissions:
      contents: read
    uses: ./.github/workflows/r-ci.yml
    with:
      runner: ubuntu-latest
      working_directory: tests/fixtures/r

  # supporting — mutation testing over the Rust fixture. cargo-mutants is used
  # supporting — mutation testing over the Rust fixture. cargo-mutants is used
  # rather than a Python or JS mutator because the crate is dependency-free, so
  # the only install is the mutator itself.
  fixture-mutation-testing:
    name: fixture / mutation-testing
    permissions:
      contents: read
    uses: ./.github/workflows/mutation-testing.yml
    with:
      runner: ubuntu-latest
      language: rust
      working_directory: tests/fixtures/rust
      install_command: "cargo install cargo-mutants --locked"
      mutation_command: "cargo mutants --no-shuffle --test-tool=cargo -j 2"

  fixture-dart-flutter-ci:
    name: fixture / dart-flutter-ci
    permissions:
      contents: read
    uses: ./.github/workflows/dart-flutter-ci.yml
    with:
      runner: ubuntu-latest
      flutter_version: '3.47.0'
      working_directory: tests/fixtures/flutter

  fixture-kotlin-android-ci:
    name: fixture / kotlin-android-ci
    permissions:
      contents: read
    uses: ./.github/workflows/kotlin-android-ci.yml
    with:
      runner: ubuntu-latest
      working_directory: tests/fixtures/android

  fixture-qt-ci:
    name: fixture / qt-ci
    permissions:
      contents: read
    uses: ./.github/workflows/qt-ci.yml
    with:
      runner: ubuntu-latest
      qt_version: '6.8.3'
      working_directory: tests/fixtures/qt

  observe-dart-flutter-ci:
    name: observe / dart-flutter-ci
    needs: fixture-dart-flutter-ci
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up isolated Python contract runtime
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
          update-environment: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          # Pinned, not inherited: setup-uv's `version` defaults to the
          # version in pyproject.toml or, absent one, whatever is latest.
          # There is no pyproject.toml here, so this resolved to latest --
          # a SHA-pinned action installing an unpinned tool.
          version: 0.11.30
          # Evidence must come from a cold, reviewable run: a restored entry
          # would make the receipt describe something other than this run.
          enable-cache: false
      - name: Provision validator
        env:
          PYTHON_PATH: ${{ steps.python.outputs.python-path }}
        run: |
          "$PYTHON_PATH" -I -B -m venv --copies .venv
          uv pip install --python .venv/bin/python --require-hashes -r requirements-ci.txt
      - name: Reject missing, skipped, or partial Flutter evidence
        env:
          CALLER_RESULT: ${{ needs.fixture-dart-flutter-ci.result }}
          SDK_RUNTIME_EVIDENCE: ${{ needs.fixture-dart-flutter-ci.outputs.evidence }}
        run: |
          test "$CALLER_RESULT" = success
          .venv/bin/python -I -B scripts/check_python_execution_contract.py --launch check_sdk_runtime_fixtures.py -- --receipt flutter

  observe-kotlin-android-ci:
    name: observe / kotlin-android-ci
    needs: fixture-kotlin-android-ci
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up isolated Python contract runtime
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
          update-environment: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          # Pinned, not inherited: setup-uv's `version` defaults to the
          # version in pyproject.toml or, absent one, whatever is latest.
          # There is no pyproject.toml here, so this resolved to latest --
          # a SHA-pinned action installing an unpinned tool.
          version: 0.11.30
          # Evidence must come from a cold, reviewable run: a restored entry
          # would make the receipt describe something other than this run.
          enable-cache: false
      - name: Provision validator
        env:
          PYTHON_PATH: ${{ steps.python.outputs.python-path }}
        run: |
          "$PYTHON_PATH" -I -B -m venv --copies .venv
          uv pip install --python .venv/bin/python --require-hashes -r requirements-ci.txt
      - name: Reject missing, skipped, or partial Android evidence
        env:
          CALLER_RESULT: ${{ needs.fixture-kotlin-android-ci.result }}
          SDK_RUNTIME_EVIDENCE: ${{ needs.fixture-kotlin-android-ci.outputs.evidence }}
        run: |
          test "$CALLER_RESULT" = success
          .venv/bin/python -I -B scripts/check_python_execution_contract.py --launch check_sdk_runtime_fixtures.py -- --receipt android

  # Proves the committed Android closure still reproduces from a clean tree. The
  # generator resolves the exact default `./gradlew build` twice -- once writing
  # locks and verification metadata, once replaying them strictly from a fresh
  # Gradle home -- and compares the result against what is committed. Only facts
  # any conforming toolchain reproduces are compared; host JDK and SDK identity
  # belong to the per-run receipt, not to a file in git.
  generate-android-provenance:
    name: reproduce / android provenance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          java-version: '21'
          distribution: temurin
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd  # v4.0.4
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0'
      - name: Set up isolated Python contract runtime
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
          update-environment: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          # Pinned, not inherited: setup-uv's `version` defaults to the
          # version in pyproject.toml or, absent one, whatever is latest.
          # There is no pyproject.toml here, so this resolved to latest --
          # a SHA-pinned action installing an unpinned tool.
          version: 0.11.30
          # Evidence must come from a cold, reviewable run: a restored entry
          # would make the receipt describe something other than this run.
          enable-cache: false
      - name: Provision validator
        env:
          PYTHON_PATH: ${{ steps.python.outputs.python-path }}
        run: |
          "$PYTHON_PATH" -I -B -m venv --copies .venv
          uv pip install --python .venv/bin/python --require-hashes -r requirements-ci.txt
      - name: Regenerate the exact-build closure
        run: |
          .venv/bin/python -I -B scripts/check_python_execution_contract.py \
            --launch generate_android_fixture_provenance.py --
      - name: Publish the generated closure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: android-fixture-closure
          path: |
            tests/fixtures/android/gradle/verification-metadata.xml
            tests/fixtures/android/gradle/provenance-manifest.json
            tests/fixtures/android/**/*.lockfile
          if-no-files-found: error
      - name: Reject drift from the committed closure
        run: |
          set -euo pipefail
          if ! git --no-pager diff --exit-code -- tests/fixtures/android; then
            echo "::error::the committed Android closure no longer reproduces" >&2
            exit 1
          fi
          echo "Android exact-build closure reproduced byte for byte." \
            >> "$GITHUB_STEP_SUMMARY"

  observe-qt-ci:
    name: observe / qt-ci
    needs: fixture-qt-ci
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up isolated Python contract runtime
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
          update-environment: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          # Pinned, not inherited: setup-uv's `version` defaults to the
          # version in pyproject.toml or, absent one, whatever is latest.
          # There is no pyproject.toml here, so this resolved to latest --
          # a SHA-pinned action installing an unpinned tool.
          version: 0.11.30
          # Evidence must come from a cold, reviewable run: a restored entry
          # would make the receipt describe something other than this run.
          enable-cache: false
      - name: Provision validator
        env:
          PYTHON_PATH: ${{ steps.python.outputs.python-path }}
        run: |
          "$PYTHON_PATH" -I -B -m venv --copies .venv
          uv pip install --python .venv/bin/python --require-hashes -r requirements-ci.txt
      - name: Reject missing, skipped, or partial Qt evidence
        env:
          CALLER_RESULT: ${{ needs.fixture-qt-ci.result }}
          SDK_RUNTIME_EVIDENCE: ${{ needs.fixture-qt-ci.outputs.evidence }}
        run: |
          test "$CALLER_RESULT" = success
          .venv/bin/python -I -B scripts/check_python_execution_contract.py --launch check_sdk_runtime_fixtures.py -- --receipt qt

  # One place to read the outcome, and the digests to paste into the ledger when
  # `dart-flutter-ci.yml` and `qt-ci.yml` have no lane here on purpose. Their
  # vendored setup actions name nested actions by tag, and this repository
  # requires every action to be pinned to a full-length commit SHA, so the job is
  # refused during `Set up job` before a step runs. A lane that cannot start is
  # not evidence, and leaving it wired keeps this summary red for as long as the
  # block lasts, which is how an estate stops reporting the next real
  # regression. `catalog/runtime-coverage.yml` records both as `blocked` with the
  # barrier and the handoff, and `check_sdk_runtime_fixtures.py` fails if the two
  # ever disagree. See https://github.com/NDDev-Technocracy-Archive/ci-workflows-20261014/issues/150
  evidence:
    name: evidence summary (languages)
    needs:
      - fixture-mutation-testing
      - fixture-r-ci
      - fixture-benchmark-compare
      - fixture-dart-flutter-ci
      - fixture-kotlin-android-ci
      - fixture-qt-ci
      - observe-dart-flutter-ci
      - observe-kotlin-android-ci
      - observe-qt-ci
      - fixture-go-ci
      - fixture-python-ci
      - fixture-python-pip
      - fixture-node-ci
      - fixture-node-package-managers
      - fixture-rust-ci
      - fixture-cpp-ci
      - fixture-terraform-ci
      - fixture-sql-ci
      - fixture-docs-quality
      - fixture-hadolint
      - fixture-web-ci
      - fixture-container-ci
      - fixture-cross-platform-smoke
      - fixture-java-ci
      - fixture-dotnet-ci
      - fixture-swift-ci
      - fixture-go-ci-os
      - fixture-python-ci-os
      - fixture-rust-ci-os
      - fixture-dotnet-ci-os
      - fixture-java-ci-os
      - fixture-node-ci-os
      - fixture-terraform-ci-os
      - fixture-sql-ci-os
      - fixture-web-ci-os
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up isolated Python contract runtime
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
          update-environment: false

      - name: Provision isolated Python contract runtime
        env:
          PYTHON_PATH: ${{ steps.python.outputs.python-path }}
        run: >-
          "$PYTHON_PATH" -I -B -m venv --copies .venv

      - name: Render evidence for the runtime-coverage ledger
        env:
          RESULTS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PROVES: >-
            {"fixture-go-ci":"go-ci.yml","fixture-python-ci":"python-ci.yml","fixture-python-pip":"python-ci.yml","fixture-node-ci":"node-ci.yml","fixture-node-package-managers":"node-ci.yml","fixture-rust-ci":"rust-ci.yml","fixture-cpp-ci":"cpp-ci.yml","fixture-terraform-ci":"terraform-ci.yml","fixture-sql-ci":"sql-ci.yml","fixture-docs-quality":"docs-quality.yml","fixture-hadolint":"hadolint-ci.yml","fixture-web-ci":"web-ci.yml","fixture-container-ci":"container-ci.yml","fixture-cross-platform-smoke":"cross-platform-smoke.yml","fixture-java-ci":"java-ci.yml","fixture-dotnet-ci":"dotnet-ci.yml","fixture-swift-ci":"swift-ci.yml","fixture-mutation-testing":"mutation-testing.yml","fixture-r-ci":"r-ci.yml","fixture-benchmark-compare":"benchmark-compare.yml","fixture-dart-flutter-ci":"dart-flutter-ci.yml","fixture-kotlin-android-ci":"kotlin-android-ci.yml","fixture-qt-ci":"qt-ci.yml","fixture-go-ci-os":"go-ci.yml","fixture-python-ci-os":"python-ci.yml","fixture-rust-ci-os":"rust-ci.yml","fixture-dotnet-ci-os":"dotnet-ci.yml","fixture-java-ci-os":"java-ci.yml","fixture-node-ci-os":"node-ci.yml","fixture-terraform-ci-os":"terraform-ci.yml","fixture-sql-ci-os":"sql-ci.yml","fixture-web-ci-os":"web-ci.yml"}
          GUARDS: >-
            {"fixture-dart-flutter-ci":["observe-dart-flutter-ci"],"fixture-kotlin-android-ci":["observe-kotlin-android-ci"],"fixture-qt-ci":["observe-qt-ci"]}
        run: |
          set -euo pipefail
          .venv/bin/python -I -B scripts/check_python_execution_contract.py --launch render_runtime_evidence.py --

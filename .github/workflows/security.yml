name: security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # This repository's contract (scripts/check_workflow_contracts.py): one group per run and no
  # cancellation, so no security evidence run is ever superseded or erased.
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  codeql:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read # check out the repository being analysed
      security-events: write # upload the CodeQL results to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ contains(fromJSON('["go","java-kotlin","csharp","cpp","swift"]'), matrix.language) && 'autobuild' || 'none' }}
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}


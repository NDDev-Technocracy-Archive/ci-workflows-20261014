name: public-scorecard-analysis

# Read-only OSSF Scorecard analysis for PUBLIC repositories. This physical
# entrypoint cannot publish results, upload SARIF, or request OIDC/write scopes.

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: 'ubuntu-latest'
      filter_rule_ids:
        description: 'Comma-separated Scorecard rule IDs to DROP from results (e.g. "MaintainedID,CodeReviewID,CIIBestPracticesID"). Empty = keep all.'
        type: string
        default: ''
      normalize_placeholder_uris:
        description: 'Replace "no file associated with this alert" artifact URIs with a URI-safe placeholder (avoids upload errors).'
        type: boolean
        default: false
      sarif_category:
        description: 'Fail-closed upload fallback; upstream Scorecard runAutomationDetails define the three analysis categories.'
        type: string
        default: 'ossf-scorecard'

permissions: {}

jobs:
  scorecard:
    name: OSSF Scorecard (analysis only)
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    permissions:
      contents: read          # read the repository Scorecard evaluates
      actions: read           # Scorecard inspects workflow definitions
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25  # v2.22.1
        with:
          egress-policy: audit

      - name: Validate public default-branch contract
        shell: bash
        env:
          SCORECARD_EVENT_NAME: ${{ github.event_name }}
          SCORECARD_REF: ${{ github.ref }}
          SCORECARD_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SCORECARD_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          SCORECARD_REPOSITORY_FORK: ${{ github.event.repository.fork }}
          SCORECARD_SERVER_URL: ${{ github.server_url }}
          SCORECARD_SARIF_CATEGORY: ${{ inputs.sarif_category }}
        run: |
          set -euo pipefail
          python3 -I <<'PY'
          import os
          import re

          def fail(message):
              print(f"Scorecard contract rejected: {message}")
              raise SystemExit(1)

          event = os.environ["SCORECARD_EVENT_NAME"]
          default_branch = os.environ["SCORECARD_DEFAULT_BRANCH"]
          expected_ref = f"refs/heads/{default_branch}"
          if os.environ["SCORECARD_SERVER_URL"] != "https://github.com":
              fail("OpenSSF Scorecard Action does not support GitHub Enterprise Server")
          if os.environ["SCORECARD_REPOSITORY_PRIVATE"] != "false":
              fail("the SARIF workflow requires a public repository")
          if os.environ["SCORECARD_REPOSITORY_FORK"] != "false":
              fail("OpenSSF Scorecard Action does not support fork repositories")
          if event not in {"push", "schedule"}:
              fail("supported events are push and schedule only")
          if not default_branch or os.environ["SCORECARD_REF"] != expected_ref:
              fail(f"the run must evaluate the actual default-branch ref {expected_ref!r}")
          category = os.environ["SCORECARD_SARIF_CATEGORY"]
          if not re.fullmatch(r"[a-z0-9][a-z0-9._-]{0,63}", category):
              fail("sarif_category fallback must be 1-64 lowercase URI-safe characters")
          print(
              f"validated public Scorecard run: event={event} "
              f"ref={expected_ref} category={category}"
          )
          PY

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e  # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false

      - name: Normalize placeholder URIs
        if: ${{ inputs.normalize_placeholder_uris }}
        shell: bash
        run: |
          set -euo pipefail
          # Replace the non-URI-safe placeholder that Scorecard emits for
          # alerts not tied to a specific file, which causes upload errors.
          jq '(.runs[].results[].artifactLocation.uri // empty) |=
              (if . == "no file associated with this alert"
               then "no-file-associated-with-this-alert" else . end)' \
            results.sarif > results.filtered.sarif
          mv results.filtered.sarif results.sarif

      - name: Filter rule IDs
        if: ${{ inputs.filter_rule_ids != '' }}
        shell: bash
        env:
          FILTER_RULE_IDS: ${{ inputs.filter_rule_ids }}
        run: |
          set -euo pipefail
          # Build a jq "select" condition to drop results/rules by ruleId.
          IFS=',' read -ra IDS <<< "$FILTER_RULE_IDS"
          cond=""
          for id in "${IDS[@]}"; do
            id=$(echo "$id" | xargs)  # trim whitespace
            cond+="select(.ruleId != \"$id\") and "
          done
          cond="${cond% and }"
          # Filter results and drop orphaned rule definitions
          jq --argjson cond "$cond" '
            .runs[].results |= map(. | select($cond)) |
            .runs[].tool.driver.rules |= map(. | select(.id as $id | $cond))
          ' results.sarif > results.filtered.sarif
          mv results.filtered.sarif results.sarif

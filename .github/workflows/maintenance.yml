name: maintenance

# Advisory sweep. Never blocks a pull request.
#
# This runs the checks whose failure is maintenance debt rather than a defect in
# somebody's change: the full calendar sweep of the external product-fact ledger
# and the runtime-coverage waivers, plus the broad documentation link audit.
#
# They used to sit in the required `ci-gate`, which meant an external vendor's
# tariff reaching its expiry date made every unrelated pull request unmergeable.
# Moving them here is not a downgrade of the rule — the ledger still expires
# closed, and a change that *depends* on a stale fact is still blocked by the
# `touched` tier in ci.yml. What changed is who pays: the maintainer on a timer,
# not whoever happened to open the next pull request.
#
# The result is filed as a single tracking issue rather than left in a run log,
# because an advisory nobody reads is the failure mode this is meant to avoid.

on:
  schedule:
    # Mondays 07:00 UTC, an hour after the Dependabot window, so a fact refresh
    # and a pin bump land in the same review sitting.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  sweep:
    name: advisory sweep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write   # file/update the single tracking issue
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed  # v2.22.0
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            astral.sh:443
            pypi.org:443
            files.pythonhosted.org:443
            # check_flutter_pin resolves the fixture's pinned release against
            # Google's published Flutter manifest. This is the only host the
            # advisory sweep reaches beyond GitHub and the Python index, and
            # without it the check reports the pin as unverified every week.
            storage.googleapis.com:443
            # check_qt_pin resolves the fixture's pinned Qt release against the
            # published repository index; the pin it caught named a version the
            # open-source repository does not carry at all.
            download.qt.io:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The sweep reconciles CHANGELOG headings against SemVer tags and
          # fails closed when it can see none -- correctly, since a shallow
          # checkout cannot tell "no tags" from "no tags fetched". This job owns
          # that check, so it has to bring the refs it needs; without them its
          # very first run would have reported a defect in itself.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Python
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          update-environment: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: 0.11.30
          # The sweep decides what maintenance debt exists; it must not
          # read that from an entry written by some other ref.
          enable-cache: false

      - name: Install validator dependencies
        env:
          PYTHON_PATH: ${{ steps.python.outputs.python-path }}
        run: |
          "$PYTHON_PATH" -I -B -m venv --copies .venv
          uv pip install --python .venv/bin/python --require-hashes -r requirements-ci.txt

      - name: Run the advisory sweep
        id: sweep
        env:
          # check_transitive_action_pins resolves every pinned action's own
          # definition through the API. Unauthenticated that is 60 requests an
          # hour, which 44 actions exhaust, so the sweep passes its own token.
          GH_TOKEN: ${{ github.token }}
        # `bash {0}` and not the default. GitHub runs `run:` steps as
        # `bash -e {0}`, and `-e` arrives on the shell's own command line where
        # no `set` inside the script can reach it -- `set -uo pipefail` does not
        # remove it. So the step below claimed to tolerate a non-zero sweep and
        # did not: on the first finding, bash aborted at that very line, `$?`
        # was never read, `sweep.txt` was never printed, and `$GITHUB_OUTPUT`
        # never received a status. The reporting mechanism was unreachable in
        # exactly the case it exists for, which the first real run demonstrated.
        shell: bash {0}
        run: |
          set -uo pipefail
          .venv/bin/python -I -B scripts/check_python_syntax.py
          # A finding is the expected outcome here and must be reported, not
          # abort the job before it can be filed. See the `shell:` note above
          # for why saying so in the script alone was not enough.
          .venv/bin/python -I -B scripts/check_python_execution_contract.py --launch validate_all.py -- --tier scheduled > sweep.txt 2>&1
          status=$?
          cat sweep.txt
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          {
            echo "### Advisory sweep"
            echo
            echo '```'
            cat sweep.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # A sweep step that dies for any reason must still be reported. Without
      # this the job simply ends, and an advisory lane whose findings vanish is
      # indistinguishable from one with nothing to say.
      - name: File or update the tracking issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SWEEP_STATUS: ${{ steps.sweep.outputs.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LABEL: maintenance
        run: |
          set -euo pipefail
          title="Maintenance: advisory sweep findings"
          # An empty status means the sweep step never reached the line that
          # records one. Treat that as a finding rather than as silence: the
          # failure mode this whole job guards against is debt nobody meets.
          if [ -z "${SWEEP_STATUS}" ]; then
            SWEEP_STATUS=1
            printf 'the advisory sweep did not complete; see %s\n' "$RUN_URL" > sweep.txt
          fi
          existing="$(gh issue list --state open --search "$title in:title" \
            --json number --jq '.[0].number // empty')"

          if [ "$SWEEP_STATUS" = "0" ]; then
            if [ -n "$existing" ]; then
              gh issue close "$existing" \
                --comment "Advisory sweep is clean as of ${RUN_URL}."
              echo "closed tracking issue #${existing}"
            else
              echo "sweep clean; nothing to file"
            fi
            exit 0
          fi

          {
            echo "The scheduled advisory sweep reported findings."
            echo
            echo "These do **not** block pull requests. They are maintenance debt:"
            echo "expired external product facts, runtime-coverage waivers past"
            echo "their date, or broken local documentation links."
            echo
            echo "Refreshing a fact means re-reading its \`source_urls\` and"
            echo "correcting it. Bumping the date alone is exactly what the"
            echo "freshness gate exists to prevent. Stagger the new expiries."
            echo
            echo "Run: ${RUN_URL}"
            echo
            echo '```'
            cat sweep.txt
            echo '```'
          } > body.md

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
            echo "commented on tracking issue #${existing}"
          else
            # The label is a filing convenience; the report is the point. Passing
            # `--label` to `gh issue create` makes a label that does not exist in
            # the repository -- which was the case here -- abort the creation
            # under `set -e`, so the one mechanism that turns an advisory finding
            # into something a human meets would have destroyed itself on its
            # first run. Create first, label after, and survive not labelling.
            url="$(gh issue create --title "$title" --body-file body.md)"
            echo "filed tracking issue ${url}"
            if ! gh issue edit "$url" --add-label "$LABEL"; then
              echo "::warning::filed ${url} but could not apply the '${LABEL}' label"
            fi
          fi

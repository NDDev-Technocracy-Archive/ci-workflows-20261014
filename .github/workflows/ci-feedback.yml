name: Reusable CI feedback

on:
  workflow_call:
    inputs:
      run-id:
        required: true
        type: string
      run-attempt:
        required: true
        type: string
      allow-in-progress:
        description: Report completed failed jobs on an unfinished exact attempt.
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: ci-feedback-${{ github.repository_id }}-${{ github.run_id }}-${{ inputs.run-id }}-${{ inputs.run-attempt }}
  cancel-in-progress: false

jobs:
  notify:
    name: Publish unassigned CI evidence
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read # Read exact completed run and job metadata.
      issues: write # Publish bounded failure evidence in the caller repository.
    steps:
      # Trusted immutable action code only. No checkout of the triggering PR.
      # The action lives beside this workflow, but `./` in a called workflow
      # resolves against the CALLER's workspace, not this repository: with no
      # checkout the workspace is empty, and with one it holds the caller's
      # tree. Either way `./actions/ci-feedback` cannot resolve, which is how
      # 0.1.21 shipped this path broken for every reusable caller. Name the
      # repository explicitly and pin it.
      - uses: NDDev-OpenNetwork/ci-workflows/actions/ci-feedback@d92026cf31a10a0eeaa532e1f323c7cfdfbfac5b  # 0.1.29
        with:
          run-id: ${{ inputs.run-id }}
          run-attempt: ${{ inputs.run-attempt }}
          allow-in-progress: ${{ inputs.allow-in-progress }}
          token: ${{ github.token }}

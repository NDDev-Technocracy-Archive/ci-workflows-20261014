name: secret-scan

# Reusable Gitleaks secret scan (history-aware) for BOTH tiers. The workflow is
# private-free safe: it contains no StepSecurity action or paid GitHub feature.

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: 'ubuntu-latest'
      gitleaks_image:
        description: 'Digest-pinned gitleaks container image.'
        type: string
        default: 'zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f'
      execution_mode:
        description: 'Execution backend: container (default) or checksum-verified binary (Linux X64 only).'
        type: string
        default: 'container'
      scan_scope:
        description: >-
          Which history to scan: ref-history (default, the checked-out ref only)
          or all-refs (every branch and tag present in the checkout).
        type: string
        default: 'ref-history'
      gitleaks_binary_version:
        description: 'Allowlisted Gitleaks binary release version (without v). Used only in binary mode.'
        type: string
        default: '8.30.1'
      gitleaks_binary_sha256:
        description: 'Exact SHA256 bound to the allowlisted version/Linux/X64 asset. Used only in binary mode.'
        type: string
        default: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
      gitleaks_config_path:
        description: 'Optional repository-relative .gitleaks.toml path.'
        type: string
        default: ''
      report_format:
        description: 'Optional gitleaks report format, e.g. sarif.'
        type: string
        default: ''
      report_path:
        description: 'Optional repository-relative report path.'
        type: string
        default: ''
      upload_report:
        description: 'Upload report_path as a workflow artifact.'
        type: boolean
        default: false
      artifact_name:
        type: string
        default: 'gitleaks-report'
      retention_days:
        type: number
        default: 14
      post_command:
        description: 'Optional repository-local text/security scan after gitleaks.'
        type: string
        default: ''

permissions: {}

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Validate Gitleaks execution contract
        shell: bash
        env:
          GITLEAKS_EXECUTION_MODE: ${{ inputs.execution_mode }}
          GITLEAKS_SCAN_SCOPE: ${{ inputs.scan_scope }}
          GITLEAKS_IMAGE: ${{ inputs.gitleaks_image }}
          GITLEAKS_BINARY_VERSION: ${{ inputs.gitleaks_binary_version }}
          GITLEAKS_BINARY_SHA256: ${{ inputs.gitleaks_binary_sha256 }}
          GITLEAKS_RUNNER_OS: ${{ runner.os }}
          GITLEAKS_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          python3 -I <<'PY'
          import os
          import re

          mode = os.environ["GITLEAKS_EXECUTION_MODE"]
          scope = os.environ["GITLEAKS_SCAN_SCOPE"]
          image = os.environ["GITLEAKS_IMAGE"]
          version = os.environ["GITLEAKS_BINARY_VERSION"]
          supplied_digest = os.environ["GITLEAKS_BINARY_SHA256"]
          runner_os = os.environ["GITLEAKS_RUNNER_OS"]
          runner_arch = os.environ["GITLEAKS_RUNNER_ARCH"]
          allowed = {
              ("8.30.1", "Linux", "X64"): {
                  "asset": "gitleaks_8.30.1_linux_x64.tar.gz",
                  "sha256": "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb",
                  "size": "8230402",
              },
          }

          def fail(message):
              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              text = f"Gitleaks execution contract rejected: {message}"
              print(text)
              if summary:
                  with open(summary, "a", encoding="utf-8") as stream:
                      stream.write(f"## Gitleaks execution contract\n\n❌ {text}\n")
              raise SystemExit(1)

          if mode not in {"container", "binary"}:
              fail("execution_mode must be exactly 'container' or 'binary'")
          # `gitleaks detect` walks every ref in the checkout by default, and
          # actions/checkout with fetch-depth: 0 fetches every branch. A finding
          # on somebody's unmerged branch therefore fails this scan on every
          # other branch, which makes a required check depend on refs the change
          # does not touch. Scanning the checked-out ref's own history is both
          # what "history-aware" is meant to say and the only scope a caller can
          # be held responsible for.
          if scope not in {"ref-history", "all-refs"}:
              fail("scan_scope must be exactly 'ref-history' or 'all-refs'")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              stream.write(
                  "GITLEAKS_LOG_OPTS=HEAD\n" if scope == "ref-history"
                  else "GITLEAKS_LOG_OPTS=--all\n"
              )
          if mode == "container":
              # The container path is the default, so it must be held to the
              # same standard as the binary path below rather than trusting a
              # caller string straight into `docker run`. A tag alone is
              # mutable: the image behind it can be replaced after review, in a
              # workflow whose whole job is reading every secret in the tree.
              # The step summary calls this a "digest-pinned caller contract";
              # until this check existed, nothing made that true.
              if not re.fullmatch(
                  r"[A-Za-z0-9][A-Za-z0-9._/-]*(?::[A-Za-z0-9][A-Za-z0-9._-]*)?"
                  r"@sha256:[0-9a-f]{64}",
                  image,
              ):
                  fail(
                      "gitleaks_image must be digest-pinned as "
                      "'<image>[:<tag>]@sha256:<64 lowercase hex>'; a mutable tag "
                      "lets the scanned image be replaced after review"
                  )
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
                  stream.write("GITLEAKS_SELECTED_MODE=container\n")
              raise SystemExit(0)
          if not re.fullmatch(r"[0-9a-f]{64}", supplied_digest):
              fail("gitleaks_binary_sha256 must be exactly 64 lowercase hexadecimal characters")
          release = allowed.get((version, runner_os, runner_arch))
          if release is None:
              supported = ", ".join(f"{v}/{system}/{arch}" for v, system, arch in allowed)
              fail(
                  f"unsupported version/platform/architecture {version}/{runner_os}/{runner_arch}; "
                  f"supported tuples: {supported}"
              )
          if supplied_digest != release["sha256"]:
              fail("gitleaks_binary_sha256 does not match the allowlisted version/platform/architecture asset")
          release_url = (
              f"https://github.com/gitleaks/gitleaks/releases/download/v{version}/"
              f"{release['asset']}"
          )
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              stream.write("GITLEAKS_SELECTED_MODE=binary\n")
              stream.write(f"GITLEAKS_BINARY_ASSET={release['asset']}\n")
              stream.write(f"GITLEAKS_BINARY_URL={release_url}\n")
              stream.write(f"GITLEAKS_BINARY_SIZE={release['size']}\n")
          print(f"validated binary contract: {version}/{runner_os}/{runner_arch}")
          PY

      - name: Isolate global Git config
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          isolated_config="$RUNNER_TEMP/nddev-ci-global.gitconfig"
          : > "$isolated_config"
          printf 'GIT_CONFIG_GLOBAL=%s\n' "$isolated_config" >> "$GITHUB_ENV"

      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks detect (history-aware, digest-pinned container)
        if: ${{ inputs.execution_mode == 'container' }}
        env:
          GITLEAKS_IMAGE: ${{ inputs.gitleaks_image }}
          GITLEAKS_CONFIG_PATH: ${{ inputs.gitleaks_config_path }}
          GITLEAKS_REPORT_FORMAT: ${{ inputs.report_format }}
          GITLEAKS_REPORT_PATH: ${{ inputs.report_path }}
        run: |
          set -euo pipefail
          started_at="$(date +%s)"
          args=(detect --source /repo --redact --no-banner --exit-code 1)
          args+=(--log-opts "$GITLEAKS_LOG_OPTS")
          if [ -n "$GITLEAKS_CONFIG_PATH" ]; then
            args+=(--config "/repo/$GITLEAKS_CONFIG_PATH")
          fi
          if [ -n "$GITLEAKS_REPORT_PATH" ]; then
            args+=(--report-path "/repo/$GITLEAKS_REPORT_PATH")
          fi
          if [ -n "$GITLEAKS_REPORT_FORMAT" ]; then
            args+=(--report-format "$GITLEAKS_REPORT_FORMAT")
          fi
          set +e
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/repo" \
            -w /repo \
            "${GITLEAKS_IMAGE}" "${args[@]}"
          scan_status=$?
          set -e
          printf 'GITLEAKS_SCAN_SECONDS=%s\n' "$(( $(date +%s) - started_at ))" >> "$GITHUB_ENV"
          exit "$scan_status"

      - name: Install verified Gitleaks binary
        if: ${{ inputs.execution_mode == 'binary' }}
        env:
          GITLEAKS_BINARY_SHA256: ${{ inputs.gitleaks_binary_sha256 }}
          GITLEAKS_BINARY_VERSION: ${{ inputs.gitleaks_binary_version }}
        run: |
          set -euo pipefail
          umask 077
          started_at="$(date +%s)"
          binary_root="$(mktemp -d "${RUNNER_TEMP}/nddev-gitleaks.XXXXXX")"
          archive="${binary_root}/${GITLEAKS_BINARY_ASSET}"
          printf 'GITLEAKS_BINARY_ROOT=%s\n' "$binary_root" >> "$GITHUB_ENV"
          curl -fsSL --retry 2 --retry-max-time 120 \
            --output "$archive" "$GITLEAKS_BINARY_URL"
          actual_size="$(wc -c < "$archive" | tr -d '[:space:]')"
          if [ "$actual_size" != "$GITLEAKS_BINARY_SIZE" ]; then
            echo "Gitleaks archive size mismatch: expected $GITLEAKS_BINARY_SIZE, got $actual_size" >&2
            exit 1
          fi
          printf '%s  %s\n' "$GITLEAKS_BINARY_SHA256" "$archive" | sha256sum -c -
          env GITLEAKS_ARCHIVE="$archive" GITLEAKS_DESTINATION="$binary_root/gitleaks" \
            python3 -I <<'PY'
          import os
          import pathlib
          import shutil
          import stat
          import tarfile

          archive = pathlib.Path(os.environ["GITLEAKS_ARCHIVE"])
          destination = pathlib.Path(os.environ["GITLEAKS_DESTINATION"])
          allowed = {"LICENSE", "README.md", "gitleaks"}

          def fail(message):
              print(f"Gitleaks archive rejected: {message}")
              raise SystemExit(1)

          try:
              with tarfile.open(archive, mode="r:gz") as bundle:
                  members = bundle.getmembers()
                  names = [member.name for member in members]
                  if len(names) != len(set(names)):
                      fail("duplicate member name")
                  if set(names) != allowed:
                      fail(f"member set must be exactly {sorted(allowed)}")
                  for member in members:
                      path = pathlib.PurePosixPath(member.name)
                      if path.is_absolute() or ".." in path.parts or path.name != member.name:
                          fail("absolute, nested, or traversal member")
                      if not member.isfile() or member.issym() or member.islnk():
                          fail("links and special files are forbidden")
                  binary = bundle.getmember("gitleaks")
                  source = bundle.extractfile(binary)
                  if source is None:
                      fail("gitleaks member has no readable content")
                  with destination.open("xb") as target:
                      shutil.copyfileobj(source, target)
          except (OSError, tarfile.TarError, KeyError) as exc:
              fail(f"cannot inspect archive: {exc}")
          destination.chmod(stat.S_IRUSR | stat.S_IWUSR | stat.S_IXUSR)
          PY
          version_output="$("$binary_root/gitleaks" version)"
          if [ "$version_output" != "$GITLEAKS_BINARY_VERSION" ]; then
            echo "Gitleaks binary version mismatch: expected $GITLEAKS_BINARY_VERSION, got $version_output" >&2
            exit 1
          fi
          printf 'GITLEAKS_BINARY_PATH=%s\n' "$binary_root/gitleaks" >> "$GITHUB_ENV"
          printf 'GITLEAKS_INSTALL_SECONDS=%s\n' "$(( $(date +%s) - started_at ))" >> "$GITHUB_ENV"

      - name: Run gitleaks detect (history-aware, verified binary)
        if: ${{ inputs.execution_mode == 'binary' }}
        env:
          GITLEAKS_CONFIG_PATH: ${{ inputs.gitleaks_config_path }}
          GITLEAKS_REPORT_FORMAT: ${{ inputs.report_format }}
          GITLEAKS_REPORT_PATH: ${{ inputs.report_path }}
        run: |
          set -euo pipefail
          started_at="$(date +%s)"
          args=(detect --source "$GITHUB_WORKSPACE" --redact --no-banner --exit-code 1)
          args+=(--log-opts "$GITLEAKS_LOG_OPTS")
          if [ -n "$GITLEAKS_CONFIG_PATH" ]; then
            args+=(--config "$GITHUB_WORKSPACE/$GITLEAKS_CONFIG_PATH")
          fi
          if [ -n "$GITLEAKS_REPORT_PATH" ]; then
            args+=(--report-path "$GITHUB_WORKSPACE/$GITLEAKS_REPORT_PATH")
          fi
          if [ -n "$GITLEAKS_REPORT_FORMAT" ]; then
            args+=(--report-format "$GITLEAKS_REPORT_FORMAT")
          fi
          set +e
          "$GITLEAKS_BINARY_PATH" "${args[@]}"
          scan_status=$?
          set -e
          printf 'GITLEAKS_SCAN_SECONDS=%s\n' "$(( $(date +%s) - started_at ))" >> "$GITHUB_ENV"
          exit "$scan_status"

      - name: Run post-secret-scan command
        if: ${{ inputs.post_command != '' }}
        env:
          POST_COMMAND: ${{ inputs.post_command }}
        run: bash -euo pipefail -c "$POST_COMMAND"

      - name: Upload gitleaks report
        if: ${{ always() && inputs.upload_report && inputs.report_path != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.report_path }}
          if-no-files-found: ignore
          retention-days: ${{ inputs.retention_days }}

      - name: Clean verified Gitleaks binary state
        if: ${{ always() && inputs.execution_mode == 'binary' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GITLEAKS_BINARY_ROOT:-}" ]; then
            echo "binary contract failed before temporary state was created; cleanup not required"
            printf 'GITLEAKS_CLEANUP=not-required\n' >> "$GITHUB_ENV"
            exit 0
          fi
          case "$GITLEAKS_BINARY_ROOT" in
            "${RUNNER_TEMP}"/nddev-gitleaks.*) ;;
            *) echo "refusing to clean unexpected path" >&2; exit 1 ;;
          esac
          find "$GITLEAKS_BINARY_ROOT" -depth -delete
          if [ -e "$GITLEAKS_BINARY_ROOT" ]; then
            echo "binary temporary state still exists after cleanup" >&2
            exit 1
          fi
          printf 'GITLEAKS_CLEANUP=verified\n' >> "$GITHUB_ENV"

      - name: Summarize Gitleaks execution
        if: ${{ always() }}
        shell: bash
        env:
          GITLEAKS_BINARY_VERSION: ${{ inputs.gitleaks_binary_version }}
          GITLEAKS_BINARY_SHA256: ${{ inputs.gitleaks_binary_sha256 }}
          GITLEAKS_RUNNER_OS: ${{ runner.os }}
          GITLEAKS_RUNNER_ARCH: ${{ runner.arch }}
          GITLEAKS_SCAN_SCOPE: ${{ inputs.scan_scope }}
        run: |
          set -euo pipefail
          {
            echo "## Gitleaks execution"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Mode | \`${GITLEAKS_SELECTED_MODE:-contract-rejected}\` |"
            echo "| Platform / architecture | \`${GITLEAKS_RUNNER_OS}/${GITLEAKS_RUNNER_ARCH}\` |"
            echo "| Scan scope | \`${GITLEAKS_SCAN_SCOPE}\` (\`${GITLEAKS_LOG_OPTS:-not-resolved}\`) |"
            if [ "${GITLEAKS_SELECTED_MODE:-}" = binary ]; then
              echo "| Pinned version | \`${GITLEAKS_BINARY_VERSION}\` |"
              echo "| Artifact SHA-256 | \`${GITLEAKS_BINARY_SHA256}\` |"
              echo "| Install seconds | \`${GITLEAKS_INSTALL_SECONDS:-not-completed}\` |"
              echo "| Scan seconds | \`${GITLEAKS_SCAN_SECONDS:-not-completed}\` |"
              echo "| Cleanup | \`${GITLEAKS_CLEANUP:-not-verified}\` |"
            else
              echo "| Container | digest-pinned caller contract |"
              echo "| Scan seconds | \`${GITLEAKS_SCAN_SECONDS:-not-completed}\` |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

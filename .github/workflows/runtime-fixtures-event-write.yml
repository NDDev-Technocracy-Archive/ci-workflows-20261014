name: runtime-fixtures-event-write

# Side-effect-sensitive evidence estate. Ordinary fixtures never receive write
# permissions. This workflow gives a write token only to the exact caller and
# cleanup jobs that need it, uses namespaced disposable state, and refuses proof
# unless the caller and cleanup observer both succeed.

on:
  push:
    branches: ['fixtures/**']
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  prepare-benchmark:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      branch: ${{ steps.scope.outputs.branch }}
    steps:
      - name: Establish disposable benchmark scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          branch="runtime-evidence/benchmark-${RUN_ID}-${RUN_ATTEMPT}"
          if ! [[ "$branch" =~ ^runtime-evidence/benchmark-[0-9]+-[0-9]+$ ]]; then
            echo "benchmark fixture: invalid disposable branch" >&2
            exit 1
          fi
          encoded_branch="${branch//\//%2F}"
          response_file="${RUNNER_TEMP}/benchmark-ref-response"
          api_result=0
          gh api --include "repos/${REPOSITORY}/git/ref/heads/${encoded_branch}" >"$response_file" 2>&1 || api_result=$?
          http_status="$(awk 'NR == 1 && $1 ~ /^HTTP/ {print $2}' "$response_file")"
          if [ "$api_result" -eq 0 ] && [ "$http_status" = 200 ]; then
            echo "benchmark fixture: disposable branch already exists" >&2
            exit 1
          fi
          if [ "$http_status" != 404 ]; then
            cat "$response_file" >&2
            echo "benchmark fixture: ref probe failed (exit=${api_result}, status=${http_status:-missing})" >&2
            exit 1
          fi
          printf 'branch=%s\n' "$branch" >>"$GITHUB_OUTPUT"
          echo "benchmark fixture: disposable branch absent before caller (HTTP 404)"

  fixture-benchmark:
    if: ${{ github.event_name != 'pull_request' }}
    needs: prepare-benchmark
    permissions:
      contents: write # pinned publish action receives only repository contents write
    uses: ./.github/workflows/benchmark.yml  # zizmor: ignore[self-repository]
    with:
      runner: ubuntu-latest
      language: go
      working_directory: tests/fixtures/go
      bench_command: 'go test -run=^$ -bench=. -benchmem > benchmark.txt'
      tool: go
      output_file_path: tests/fixtures/go/benchmark.txt
      external_data_json_path: tests/fixtures/go/benchmark-history.json
      history_branch: ${{ needs.prepare-benchmark.outputs.branch }}
      fail_on_alert: true

  cleanup-benchmark:
    if: ${{ always() && github.event_name != 'pull_request' }}
    needs: [prepare-benchmark, fixture-benchmark]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # delete only the run-scoped branch if the action wrote unexpectedly
    steps:
      - name: Reconcile disposable benchmark branch
        env:
          BRANCH: ${{ needs.prepare-benchmark.outputs.branch }}
          CALLER_RESULT: ${{ needs.fixture-benchmark.result }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! [[ "$BRANCH" =~ ^runtime-evidence/benchmark-[0-9]+-[0-9]+$ ]]; then
            echo "benchmark cleanup: refusing an out-of-scope branch" >&2
            exit 1
          fi
          encoded_branch="${BRANCH//\//%2F}"
          probe_ref() {
            local api_result=0 response_file status
            response_file="${RUNNER_TEMP}/benchmark-ref-response"
            gh api --include "repos/${REPOSITORY}/git/ref/heads/${encoded_branch}" >"$response_file" 2>&1 || api_result=$?
            status="$(awk 'NR == 1 && $1 ~ /^HTTP/ {print $2}' "$response_file")"
            if [ "$api_result" -eq 0 ] && [ "$status" = 200 ]; then
              printf 'present\n'
            elif [ "$status" = 404 ]; then
              printf 'missing\n'
            else
              cat "$response_file" >&2
              echo "benchmark cleanup: ref probe failed (exit=${api_result}, status=${status:-missing})" >&2
              return 1
            fi
          }
          ref_state="$(probe_ref)" || {
            echo "benchmark cleanup: initial ref observation failed" >&2
            exit 1
          }
          if [ "$ref_state" = present ]; then
            gh api --method DELETE "repos/${REPOSITORY}/git/refs/heads/${encoded_branch}"
            echo "benchmark cleanup: removed unexpected disposable branch"
          else
            echo "benchmark cleanup: no repository ref was created (HTTP 404)"
          fi
          ref_state="$(probe_ref)" || {
            echo "benchmark cleanup: final ref observation failed" >&2
            exit 1
          }
          if [ "$ref_state" != missing ]; then
            echo "benchmark cleanup: disposable branch remains" >&2
            exit 1
          fi
          if [ "$CALLER_RESULT" != success ]; then
            echo "benchmark cleanup: caller result was $CALLER_RESULT" >&2
            exit 1
          fi

  evidence-benchmark:
    if: ${{ always() && github.event_name != 'pull_request' }}
    needs: [fixture-benchmark, cleanup-benchmark]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up isolated Python contract runtime
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
          update-environment: false
      - name: Provision isolated Python contract runtime
        env:
          PYTHON_PATH: ${{ steps.python.outputs.python-path }}
        run: >-
          "$PYTHON_PATH" -I -B -m venv --copies .venv
      - name: Render benchmark evidence
        env:
          RESULTS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PROVES: '{"fixture-benchmark":"benchmark.yml"}'
          GUARDS: '{"fixture-benchmark":["cleanup-benchmark"]}'
        run: |
          set -euo pipefail
          .venv/bin/python -I -B scripts/check_python_execution_contract.py --launch render_runtime_evidence.py --

  prepare-pr-hygiene:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read # snapshot only this PR's pre-run ci label state
    outputs:
      had_label: ${{ steps.snapshot.outputs.had_label }}
    steps:
      - name: Snapshot PR label state
        id: snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "PR fixture: invalid pull request number" >&2
            exit 1
          fi
          labels="$(gh api --paginate "repos/${REPOSITORY}/issues/${PR_NUMBER}/labels" --jq '.[].name')"
          if grep -Fxq ci <<<"$labels"; then
            echo "PR fixture: refusing proof because ci label already exists" >&2
            exit 1
          fi
          echo 'had_label=false' >>"$GITHUB_OUTPUT"
          echo "PR fixture: ci label absent before caller"

  fixture-pr-hygiene:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]' }}
    needs: prepare-pr-hygiene
    permissions:
      contents: read       # checkout commits and the labeler configuration
      issues: write        # required ceiling for the disabled stale nested job
      pull-requests: write # validate the PR and apply the existing ci label
    uses: ./.github/workflows/pr-hygiene.yml  # zizmor: ignore[self-repository]
    with:
      runner: ubuntu-latest
      commitlint: true
      pr_title: true
      labeler: true
      labeler_config: .github/labeler-runtime-evidence.yml
      stale: false

  fixture-pr-hygiene-explicit:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]' }}
    permissions:
      contents: read       # checkout commits and validate the explicit config file
      issues: write        # required ceiling for the disabled stale nested job
      pull-requests: write # required ceiling for disabled PR mutation jobs
    uses: ./.github/workflows/pr-hygiene.yml  # zizmor: ignore[self-repository]
    with:
      runner: ubuntu-latest
      commitlint: true
      commitlint_config: .github/commitlint-runtime-evidence.mjs
      pr_title: false
      labeler: false
      stale: false

  cleanup-pr-hygiene:
    if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]' }}
    needs: [prepare-pr-hygiene, fixture-pr-hygiene]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write # observe and restore only this PR's pre-run ci label state
    steps:
      - name: Verify label write and restore prior state
        env:
          CALLER_RESULT: ${{ needs.fixture-pr-hygiene.result }}
          GH_TOKEN: ${{ github.token }}
          HAD_LABEL: ${{ needs.prepare-pr-hygiene.outputs.had_label }}
          LABELER_ALL_LABELS: ${{ needs.fixture-pr-hygiene.outputs.labeler_all_labels }}
          LABELER_NEW_LABELS: ${{ needs.fixture-pr-hygiene.outputs.labeler_new_labels }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || [ "$HAD_LABEL" != false ]; then
            echo "PR cleanup: invalid disposable scope" >&2
            exit 1
          fi
          output_has_label() {
            local output="$1"
            tr ',' '\n' <<<"$output" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -Fxq ci
          }
          if ! output_has_label "$LABELER_NEW_LABELS"; then
            echo "PR cleanup: labeler new-labels output does not prove a ci write" >&2
            exit 1
          fi
          if ! output_has_label "$LABELER_ALL_LABELS"; then
            echo "PR cleanup: labeler all-labels output does not contain ci" >&2
            exit 1
          fi
          labels="$(gh api --paginate "repos/${REPOSITORY}/issues/${PR_NUMBER}/labels" --jq '.[].name')"
          if ! grep -Fxq ci <<<"$labels"; then
            echo "PR cleanup: labeler did not apply the expected ci label" >&2
            exit 1
          fi
          gh api --method DELETE "repos/${REPOSITORY}/issues/${PR_NUMBER}/labels/ci"
          echo "PR cleanup: removed fixture-applied ci label"
          labels_after="$(gh api --paginate "repos/${REPOSITORY}/issues/${PR_NUMBER}/labels" --jq '.[].name')"
          has_after=false
          if grep -Fxq ci <<<"$labels_after"; then has_after=true; fi
          if [ "$has_after" != false ]; then
            echo "PR cleanup: prior label state was not restored" >&2
            exit 1
          fi
          if [ "$CALLER_RESULT" != success ]; then
            echo "PR cleanup: caller result was $CALLER_RESULT" >&2
            exit 1
          fi

  evidence-pr-hygiene:
    if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]' }}
    needs: [fixture-pr-hygiene, fixture-pr-hygiene-explicit, cleanup-pr-hygiene]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up isolated Python contract runtime
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
          update-environment: false
      - name: Provision isolated Python contract runtime
        env:
          PYTHON_PATH: ${{ steps.python.outputs.python-path }}
        run: >-
          "$PYTHON_PATH" -I -B -m venv --copies .venv
      - name: Render PR-hygiene evidence
        env:
          RESULTS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PROVES: '{"fixture-pr-hygiene":"pr-hygiene.yml","fixture-pr-hygiene-explicit":"pr-hygiene.yml"}'
          GUARDS: '{"fixture-pr-hygiene":["cleanup-pr-hygiene"]}'
        run: |
          set -euo pipefail
          .venv/bin/python -I -B scripts/check_python_execution_contract.py --launch render_runtime_evidence.py --

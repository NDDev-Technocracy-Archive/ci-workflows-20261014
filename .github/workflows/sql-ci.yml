name: sql-ci

# Reusable SQL CI for BOTH tiers: pinned setup-uv, and sqlfluff lint
# (dialect-aware) plus an optional caller command passed via env.

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: 'ubuntu-latest'
      working_directory:
        type: string
        default: '.'
      dialect:
        description: 'sqlfluff dialect: ansi, postgres, mysql, sqlite, bigquery, snowflake, tsql, ...'
        type: string
        default: 'ansi'
      paths:
        description: 'Path or directory to lint.'
        type: string
        default: '.'
      sqlfluff_version:
        description: 'Exact sqlfluff version to pin.'
        type: string
        default: '4.2.2'
      lint:
        description: 'Run sqlfluff lint.'
        type: boolean
        default: true
      extra_command:
        description: 'Additional command (bash), e.g. "sqlfluff format --diff". Empty to skip.'
        type: string
        default: ''
      timeout_minutes:
        type: number
        default: 15

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  sql:
    name: sql (${{ inputs.dialect }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    defaults:
      run:
        # Explicit, and not redundant with the workflow-level default above:
        # a job-level `defaults.run` replaces the workflow-level one rather than
        # merging with it, so declaring working-directory here silently drops the
        # shell. On Linux nothing changes because bash is the default anyway; on
        # Windows every run step becomes PowerShell and bash syntax stops working.
        shell: bash
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: 0.13.1
          # uv provisions our pinned tooling here, not the caller's
          # dependencies; a restored entry would be unreviewed input to a scan.
          enable-cache: false

      - name: Lint
        if: ${{ inputs.lint }}
        env:
          SQL_DIALECT: ${{ inputs.dialect }}
          SQL_PATHS: ${{ inputs.paths }}
          SQLFLUFF_VERSION: ${{ inputs.sqlfluff_version }}
        run: |
          set -euo pipefail
          uvx "sqlfluff${SQLFLUFF_VERSION:+@$SQLFLUFF_VERSION}" lint --dialect "$SQL_DIALECT" "$SQL_PATHS"
          echo "sqlfluff lint (${SQL_DIALECT}) passed." >> "$GITHUB_STEP_SUMMARY"

      - name: Extra command
        if: ${{ inputs.extra_command != '' }}
        env:
          EXTRA_COMMAND: ${{ inputs.extra_command }}
        run: bash -euo pipefail -c "$EXTRA_COMMAND"

name: private-security-bundle-free

# One private-fleet placement for actionlint, zizmor, OSV-Scanner and gitleaks
# without paid code-scanning/SARIF permissions. The companion implementation is
# fetched outside the caller workspace at the exact called-workflow SHA.

on:
  workflow_call:
    inputs:
      check_name:
        description: 'Job display name; preserve the existing name when migrating a required check.'
        type: string
        default: 'actionlint + zizmor + OSV + gitleaks (no SARIF)'
      runner:
        description: 'Private Linux X64 runner label.'
        type: string
        default: 'private-ci'
      gitleaks_config_path:
        description: 'Optional repository-relative .gitleaks.toml path.'
        type: string
        default: ''
      gitleaks_scan_scope:
        description: 'ref-history or all-refs.'
        type: string
        default: 'ref-history'
      zizmor_target:
        description: 'Repository-relative path analyzed by zizmor.'
        type: string
        default: '.'
      osv_lockfile:
        description: 'Optional repository-relative lockfile; empty scans recursively.'
        type: string
        default: ''
      evidence_artifact_name:
        description: 'Artifact name for redacted machine-readable security evidence.'
        type: string
        default: 'private-security-evidence'
    secrets:
      submodule_deploy_keys:
        description: >-
          Optional newline-separated "path base64-ssh-private-key" pairs, one
          per submodule path declared in .gitmodules. When supplied, each
          declared submodule is checked out at its recorded gitlink before
          scanning, so the gates read the pinned revision rather than
          whatever worktree a reused runner left behind. When absent, stale
          submodule worktrees are removed before scanning instead of being
          reported as this commit's content.
        required: false

permissions: {}

jobs:
  security-bundle:
    name: ${{ inputs.check_name }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Validate runner and called-workflow identity
        shell: bash
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          BUNDLE_RUNNER_OS: ${{ runner.os }}
          BUNDLE_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          test "$WORKFLOW_REPOSITORY" = NDDev-OpenNetwork/ci-workflows
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$BUNDLE_RUNNER_OS" = Linux
          test "$BUNDLE_RUNNER_ARCH" = X64

      - name: Isolate global Git config
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          isolated_config="$RUNNER_TEMP/nddev-ci-global.gitconfig"
          : > "$isolated_config"
          printf 'GIT_CONFIG_GLOBAL=%s\n' "$isolated_config" >> "$GITHUB_ENV"

      - name: Checkout caller with full ref history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Synchronize declared submodules to their recorded gitlinks
        shell: bash
        env:
          SUBMODULE_DEPLOY_KEYS: ${{ secrets.submodule_deploy_keys }}
        run: |
          set -euo pipefail
          umask 077

          if [ ! -f .gitmodules ]; then
            exit 0
          fi
          paths=$(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' \
            | awk '{print $2}')
          if [ -z "$paths" ]; then
            exit 0
          fi

          # The checkout above does not touch submodule worktrees, and on a
          # reused self-hosted worktree `git clean -ffdx` does not remove an
          # initialized submodule either — its path is a tracked gitlink, not
          # an untracked file. Whatever an earlier job left behind is then
          # what a recursive scan reads, and it reports yesterday's lockfile
          # as this commit's. Measured 2026-10-08 on a consumer superproject:
          # the gate failed a commit pinning a fixed dependency over a
          # lockfile left at the vulnerable revision by the previous job.
          #
          # So every declared path is put in a known state here: checked out
          # at its recorded gitlink when the caller supplied a key for it,
          # emptied when it did not — never scanned at whatever revision the
          # last job happened to leave.
          #
          # A symlink at a declared path redirects everything below — the
          # no-keys `rm -rf "$path"/*` would empty whatever the link targets,
          # and a keyed `submodule update` would write through it. On a reused
          # runner a hostile job could have planted one, so a symlink is
          # unlinked outright rather than followed.
          for path in $paths; do
            if [ -L "$path" ]; then
              rm -- "$path"
              mkdir -p "$path"
              printf 'unlinked  %s (symlink at a declared submodule path)\n' "$path"
            fi
          done
          if [ -z "$SUBMODULE_DEPLOY_KEYS" ]; then
            for path in $paths; do
              if [ -n "$(ls -A "$path" 2>/dev/null || true)" ]; then
                rm -rf -- "${path:?}/"* "${path:?}/".[!.]* 2>/dev/null || rm -rf -- "${path:?}"
                mkdir -p "$path"
                printf 'emptied   %s (no key; a leftover would have been scanned)\n' "$path"
              fi
            done
            echo "submodule_deploy_keys not supplied: scanning the caller tree only."
            exit 0
          fi

          # github.com:22 is not open on every runner class — discover the
          # endpoint once rather than assume it, the same discovery the
          # called-workflow fetch above performs for HTTPS.
          mkdir -p "$HOME/.ssh"
          host=github.com
          port=22
          if ssh-keyscan -T 5 -p 22 github.com >> "$HOME/.ssh/known_hosts" 2>/dev/null; then
            :
          elif ssh-keyscan -T 10 -p 443 ssh.github.com >> "$HOME/.ssh/known_hosts" 2>&1; then
            host=ssh.github.com
            port=443
          else
            echo "github.com answered on neither 22 nor 443; submodules cannot be fetched."
            exit 1
          fi
          chmod 600 "$HOME/.ssh/known_hosts"

          keydir="$(mktemp -d "$RUNNER_TEMP/submodule-keys.XXXXXXXX")"
          # Keys outlive their use only inside this step otherwise — drop them
          # on any exit path rather than leave private key material in the
          # shared runner's temp directory until the job ends.
          trap 'rm -rf "$keydir"' EXIT
          declare -A keys=()
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            keys["${line%% *}"]="${line#* }"
          done <<< "$SUBMODULE_DEPLOY_KEYS"

          git submodule init
          failed=0
          for path in $paths; do
            want=$(git ls-tree HEAD "$path" | awk '{print $3}')
            if [ -z "${keys[$path]:-}" ]; then
              echo "$path is declared in .gitmodules but has no deploy key"
              echo "in submodule_deploy_keys — a partial view is a wrong scan."
              failed=1
              continue
            fi
            name=$(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' \
              | awk -v p="$path" '$2 == p {print $1}' | sed -E 's/^submodule\.(.*)\.path$/\1/')
            url=$(git config -f .gitmodules --get "submodule.$name.url")
            repo=$(printf '%s' "$url" | sed -E 's#.*github\.com[:/]##; s#\.git$##')
            keyfile="$keydir/$(printf '%s' "$name" | tr -c 'A-Za-z0-9._-' '_').key"
            printf '%s' "${keys[$path]}" | base64 -d > "$keyfile"
            chmod 600 "$keyfile"
            # `.git/config` only, so the tracked `.gitmodules` stays untouched.
            git config "submodule.$name.url" "ssh://git@$host:$port/$repo.git"
            GIT_SSH_COMMAND="ssh -i $keyfile -o IdentitiesOnly=yes -o IdentityAgent=none -o StrictHostKeyChecking=yes" \
              git submodule update --init --force --depth 1 -- "$path"
            got=$(git -C "$path" rev-parse HEAD)
            if [ "$got" != "$want" ]; then
              echo "$path checked out $got but the gitlink records $want — refusing to scan."
              failed=1
              continue
            fi
            printf 'pinned    %s <- %s (%s)\n' "$path" "$repo" "${want:0:12}"
          done
          test "$failed" -eq 0

      - name: Fetch exact called-workflow implementation
        shell: bash
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          FETCH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          source_root="$(mktemp -d "$RUNNER_TEMP/private-security-bundle-source.XXXXXXXX")"
          git init --quiet "$source_root"
          git -C "$source_root" remote add origin "https://github.com/${WORKFLOW_REPOSITORY}.git"
          # Authenticate the fetch with the ambient token. The repository is
          # public, so anonymous worked -- until 2026-08-31, when GitHub's
          # unauthenticated fetch path failed every consumer for 77 minutes
          # (#77) while authenticated fetches of the same pin succeeded. The
          # header lives in the temp repository's local config, never on the
          # command line, and dies with $RUNNER_TEMP.
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$FETCH_TOKEN" | base64 -w0)"
          git -C "$source_root" config http.extraheader "$auth_header"
          # Retry, and fall back to protocol v0.
          #
          # Measured on a fleet host: `git -c protocol.version=2 ls-remote`
          # against a public repository fails about two times in ten, while
          # protocol.version=0 succeeded ten times out of ten, and plain HTTPS
          # to the same ref-listing endpoint returns a valid ref advertisement
          # every time. The failure surfaces as
          #
          #   fatal: could not read Username for 'https://github.com'
          #   fatal: expected flush after ref listing
          #
          # which reads like a credentials problem and is not one: the remote is
          # public, there is no gitconfig at any level on the host, no proxy
          # variables, and path MTU to github.com is clean at 1500. v2's
          # negotiation is simply not surviving this egress reliably.
          #
          # That made a security gate fail about one run in five, and a security
          # gate that fails for its own bootstrap teaches people to re-run it
          # without reading it. Three attempts, the last on v0.
          fetch_called_workflow() {
            local attempt
            for attempt in 1 2 3; do
              local version=2
              if [ "$attempt" -eq 3 ]; then
                version=0
              fi
              if git -C "$source_root" -c "protocol.version=${version}" \
                fetch --quiet --depth=1 origin "$WORKFLOW_SHA"; then
                return 0
              fi
              printf 'called-workflow fetch attempt %s failed (protocol v%s)\n' \
                "$attempt" "$version" >&2
              sleep "$attempt"
            done
            return 1
          }
          fetch_called_workflow
          git -C "$source_root" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$source_root" rev-parse HEAD)" = "$WORKFLOW_SHA"
          printf 'PRIVATE_SECURITY_BUNDLE_SCRIPT=%s\n' \
            "$source_root/scripts/run_private_security_bundle.sh" >> "$GITHUB_ENV"

      - name: Detect baked uv
        id: baked-uv
        shell: bash
        run: |
          set -euo pipefail
          available=false
          if command -v uv >/dev/null 2>&1 && [[ "$(uv --version)" == "uv 0.11.30"* ]]; then
            available=true
          fi
          printf 'available=%s\n' "$available" >> "$GITHUB_OUTPUT"

      - name: Restore pinned uv archive
        if: ${{ steps.baked-uv.outputs.available != 'true' }}
        id: uv-archive
        uses: NDDev-OpenNetwork/ci-workflows/actions/tool-cache@d92026cf31a10a0eeaa532e1f323c7cfdfbfac5b  # 0.1.29
        with:
          url: https://github.com/astral-sh/uv/releases/download/0.11.30/uv-x86_64-unknown-linux-gnu.tar.gz
          sha256: 04bc7d180d6138bf6dc08387acf507a823f397a98fea55da36b0ccc7fbce3b68
          output: ${{ runner.temp }}/private-security-tools/uv.tar.gz
          max-bytes: '67108864'

      - name: Install pinned uv fallback
        if: ${{ steps.baked-uv.outputs.available != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/private-security-tools/uv"
          tar --extract --gzip --file "$RUNNER_TEMP/private-security-tools/uv.tar.gz" \
            --directory "$RUNNER_TEMP/private-security-tools/uv"
          install -d -m 0700 "$RUNNER_TEMP/private-security-tools/bin"
          install -m 0755 "$RUNNER_TEMP/private-security-tools/uv/uv-x86_64-unknown-linux-gnu/uv" \
            "$RUNNER_TEMP/private-security-tools/bin/uv"
          install -m 0755 "$RUNNER_TEMP/private-security-tools/uv/uv-x86_64-unknown-linux-gnu/uvx" \
            "$RUNNER_TEMP/private-security-tools/bin/uvx"
          printf '%s\n' "$RUNNER_TEMP/private-security-tools/bin" >> "$GITHUB_PATH"

      - name: Restore actionlint archive
        uses: NDDev-OpenNetwork/ci-workflows/actions/tool-cache@d92026cf31a10a0eeaa532e1f323c7cfdfbfac5b  # 0.1.29
        with:
          url: https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          sha256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          output: ${{ runner.temp }}/private-security-tools/actionlint.tar.gz
          max-bytes: '16777216'

      - name: Restore OSV-Scanner binary
        uses: NDDev-OpenNetwork/ci-workflows/actions/tool-cache@d92026cf31a10a0eeaa532e1f323c7cfdfbfac5b  # 0.1.29
        with:
          url: https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64
          sha256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
          output: ${{ runner.temp }}/private-security-tools/osv-scanner
          max-bytes: '268435456'

      - name: Restore gitleaks archive
        uses: NDDev-OpenNetwork/ci-workflows/actions/tool-cache@d92026cf31a10a0eeaa532e1f323c7cfdfbfac5b  # 0.1.29
        with:
          url: https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          sha256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          output: ${{ runner.temp }}/private-security-tools/gitleaks.tar.gz
          max-bytes: '16777216'

      - name: Run consolidated security gates without SARIF upload
        id: scan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITLEAKS_CONFIG_PATH: ${{ inputs.gitleaks_config_path }}
          GITLEAKS_SCAN_SCOPE: ${{ inputs.gitleaks_scan_scope }}
          ZIZMOR_TARGET: ${{ inputs.zizmor_target }}
          OSV_LOCKFILE: ${{ inputs.osv_lockfile }}
          ZIZMOR_SARIF_PATH: ${{ runner.temp }}/private-security-zizmor.sarif
          OSV_SARIF_PATH: ${{ runner.temp }}/private-security-osv.sarif
          GITLEAKS_SARIF_PATH: ${{ runner.temp }}/private-security-gitleaks.sarif
          ACTIONLINT_LOG_PATH: ${{ runner.temp }}/private-security-actionlint.log
          ACTIONLINT_ARCHIVE_PATH: ${{ runner.temp }}/private-security-tools/actionlint.tar.gz
          OSV_SCANNER_PATH: ${{ runner.temp }}/private-security-tools/osv-scanner
          GITLEAKS_ARCHIVE_PATH: ${{ runner.temp }}/private-security-tools/gitleaks.tar.gz
        run: "$PRIVATE_SECURITY_BUNDLE_SCRIPT"

      - name: Upload redacted security evidence
        id: evidence_artifact
        continue-on-error: true # a failed upload must complete the checked log fallback
        # Only when the gates actually ran; see the note in
        # nddev-security-bundle.yml. `always()` here turned a bootstrap failure
        # into a missing-SARIF message that named the wrong step.
        if: ${{ !cancelled() && steps.scan.conclusion != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ inputs.evidence_artifact_name }}
          path: |
            ${{ runner.temp }}/private-security-actionlint.log
            ${{ runner.temp }}/private-security-zizmor.sarif
            ${{ runner.temp }}/private-security-osv.sarif
            ${{ runner.temp }}/private-security-gitleaks.sarif
          if-no-files-found: error
          retention-days: 1
          compression-level: 9

      - name: Preserve security evidence in the run log
        if: ${{ !cancelled() && steps.evidence_artifact.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          bash "$(dirname "$PRIVATE_SECURITY_BUNDLE_SCRIPT")/security_evidence_to_log.sh"

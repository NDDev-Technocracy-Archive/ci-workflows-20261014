# Canonical public default-branch consumer for Scorecard SARIF evidence.
name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "31 2 * * 1"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  analysis-only:
    permissions:
      contents: read # read the public repository Scorecard evaluates
      actions: read # inspect workflow definitions for the scoring checks
    uses: ./.github/workflows/public-scorecard-analysis.yml  # zizmor: ignore[self-repository]
    with:
      runner: ubuntu-latest
      sarif_category: ossf-scorecard

  scorecard:
    permissions:
      security-events: write # upload the Scorecard SARIF to Code Scanning
      id-token: write # OpenSSF Scorecard publish provenance
      contents: read # read the public repository Scorecard evaluates
      actions: read # inspect workflow definitions for the scoring checks
    uses: ./.github/workflows/public-scorecard.yml  # zizmor: ignore[self-repository]
    with:
      runner: ubuntu-latest
      publish_results: true
      sarif_category: ossf-scorecard

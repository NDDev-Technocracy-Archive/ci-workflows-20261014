name: rust-supply-chain

# Reusable Rust supply-chain checks: cargo-deny (bans/licenses/advisories/
# sources), cargo-audit (RustSec advisories), and cargo-machete (dead-code
# dependency detection). Each check is independently toggleable.
#
# Tools use the checksum manifests in the SHA-pinned taiki-e/install-action.
# cargo-deny retains version 0.20.2 from the previous container action, without
# making a dependency check depend on an unauthenticated Docker Hub pull.
#
# Usage:
#   deny:
#     uses: NDDev-Technocracy-Sandbox/ci-workflows/.github/workflows/rust-supply-chain.yml@<sha>
#     with:
#       enable_deny: true
#       enable_audit: true
#       enable_machete: true

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner label for native Rust supply-chain tools.'
        type: string
        default: 'ubuntu-latest'
      deny_runner:
        description: 'Optional runner label for cargo-deny; empty inherits runner. Docker is not required.'
        type: string
        default: ''
      toolchain:
        description: 'Rust toolchain version used by all three checks.'
        type: string
        default: 'stable'
      enable_deny:
        description: 'Run cargo-deny (bans/licenses/advisories/sources).'
        type: boolean
        default: true
      enable_audit:
        description: 'Run cargo-audit (RustSec vulnerability advisories).'
        type: boolean
        default: true
      enable_machete:
        description: 'Run cargo-machete (unused dependency detection).'
        type: boolean
        default: true
      deny_command:
        description: 'cargo-deny check arguments.'
        type: string
        default: 'check bans licenses advisories sources'
      deny_arguments:
        description: 'Global cargo-deny arguments, before the check command (for example --config path/to/deny.toml).'
        type: string
        default: '--all-features'
      cargo_audit_version:
        description: 'cargo-audit version to install via taiki-e/install-action.'
        type: string
        default: '0.22.2'
      cargo_machete_version:
        description: 'cargo-machete version to install via taiki-e/install-action.'
        type: string
        default: '0.9.2'
      working_directory:
        description: 'Working directory for cargo commands (for monorepos/subdirs).'
        type: string
        default: '.'

permissions: {}

jobs:
  deny:
    name: cargo-deny
    if: ${{ inputs.enable_deny }}
    runs-on: ${{ inputs.deny_runner || inputs.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f  # v2.0.0
        with:
          toolchain: ${{ inputs.toolchain }}
          cache: false
      - name: Install cargo-deny
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a  # v2.87.25
        with:
          tool: cargo-deny@0.20.2
      - name: Run cargo-deny
        shell: bash
        env:
          DENY_COMMAND: ${{ inputs.deny_command }}
          DENY_DIRECTORY: ${{ inputs.working_directory }}
          DENY_ARGUMENTS: ${{ inputs.deny_arguments }}
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import os
          import shlex
          # Inputs are argv data, never a second shell program. Keep paths
          # relative to the caller checkout, as in the previous action.
          arguments = ["cargo", "deny", "--manifest-path",
                       os.path.join(os.environ["DENY_DIRECTORY"], "Cargo.toml")]
          arguments += shlex.split(os.environ["DENY_ARGUMENTS"])
          arguments += shlex.split(os.environ["DENY_COMMAND"])
          os.execvp(arguments[0], arguments)
          PY

  audit:
    name: cargo-audit
    if: ${{ inputs.enable_audit }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f  # v2.0.0
        with:
          toolchain: ${{ inputs.toolchain }}
      - name: Install cargo-audit
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a  # v2.87.25
        with:
          tool: cargo-audit@${{ inputs.cargo_audit_version }}
      - name: Run cargo-audit
        working-directory: ${{ inputs.working_directory }}
        run: cargo audit

  machete:
    name: cargo-machete
    if: ${{ inputs.enable_machete }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f  # v2.0.0
        with:
          toolchain: ${{ inputs.toolchain }}
      - name: Install cargo-machete
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a  # v2.87.25
        with:
          tool: cargo-machete@${{ inputs.cargo_machete_version }}
      - name: Run cargo-machete
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          # cargo-machete exits 0 even with findings; grep for unused deps
          output="$(cargo machete --skip-metadata-dir 2>&1 || true)"
          echo "$output"
          if echo "$output" | grep -qiE "^(Analyzing|  )" && echo "$output" | grep -qE "^\s+\S+\s*$"; then
            echo "::warning::cargo-machete found potentially unused dependencies (check output above)"
          fi

# Each security call uses a fresh implementation directory and verifies that
# the selected Git history is available before scanning.
# If artifact storage is unavailable, complete redacted reports are preserved
# as a checksummed ZIP in the security evidence fallback step log.
# Private security suite with zero GitHub Actions compute meter.
# Replace `private-ci` with an isolated ephemeral runner label registered only
# to private repositories. Destroy the worker after one job; cost control must not
# expose a persistent trusted machine to pull-request code. Self-hosted
# infrastructure still has its own cost; this promise covers only GitHub
# Actions runner-minute metering.
# Replace @<sha> with a pinned full commit SHA of ci-workflows.
name: security
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  security-bundle:
    permissions: { contents: read }
    uses: NDDev-Technocracy-Sandbox/ci-workflows/.github/workflows/private-security-bundle-free.yml@<sha>
    with:
      runner: private-ci
      # Optional: keep a pre-existing inner job name when moving from the SARIF bundle.
      check_name: actionlint + zizmor + OSV + gitleaks
    # Optional, for callers with private submodules: each declared submodule
    # is checked out at its recorded gitlink before scanning. Without it,
    # stale submodule worktrees on a reused runner are emptied rather than
    # scanned at whatever revision an earlier job left behind.
    # secrets:
    #   submodule_deploy_keys: ${{ secrets.SUBMODULE_DEPLOY_KEYS }}
  validate:
    permissions: { contents: read }
    uses: NDDev-Technocracy-Sandbox/ci-workflows/.github/workflows/private-static.yml@<sha>
    with:
      runner: private-ci
      command: "python3 scripts/validate_all.py"

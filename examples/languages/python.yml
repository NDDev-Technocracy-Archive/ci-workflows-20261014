# Python CI caller (any tier). Replace @<sha> with a pinned full commit SHA.
name: python
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  python:
    permissions: { contents: read }
    uses: NDDev-Technocracy-OpenNetwork/ci-workflows/.github/workflows/python-ci.yml@<sha>
    with:
      runner: ubuntu-latest
      package_manager: uv
      python_version: '3.13'
      install_command: 'uv sync --frozen'
      test_command: 'uv run pytest'
      # pip callers may instead set cache: pip and point this at their lock or
      # hashed requirements file. uv callers use setup-uv's own cache.

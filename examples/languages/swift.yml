# Swift CI caller. Uses a macOS runner (billed at a 10x minute multiplier).
# Replace @<sha> with a pinned full commit SHA.
name: swift
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  swift:
    permissions: { contents: read }
    uses: NDDev-Technocracy-Archive/ci-workflows-20261014/.github/workflows/swift-ci.yml@<sha>
    with:
      runner: macos-latest
      swiftlint: true

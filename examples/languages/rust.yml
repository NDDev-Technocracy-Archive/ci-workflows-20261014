# Rust CI caller (any tier). Replace @<sha> with a pinned full commit SHA.
name: rust
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  rust:
    permissions: { contents: read }
    uses: NDDev-Technocracy-Archive/ci-workflows-20261014/.github/workflows/rust-ci.yml@<sha>
    with:
      runner: ubuntu-latest
      components: 'clippy,rustfmt'
      build_command: 'cargo build --locked --all-targets'
      test_command: 'cargo test --locked'

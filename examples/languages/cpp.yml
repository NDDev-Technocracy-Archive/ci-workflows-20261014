# C/C++ CI caller (any tier). Replace @<sha> with a pinned full commit SHA.
name: cpp
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  cpp:
    permissions: { contents: read }
    uses: NDDev-Technocracy-Archive/ci-workflows-20261014/.github/workflows/cpp-ci.yml@<sha>
    with:
      runner: ubuntu-latest
      apt_packages: 'cppcheck ninja-build'
      format_check: true
      cppcheck: true

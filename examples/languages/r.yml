# R CI caller (any tier). Replace @<sha> with a pinned full commit SHA.
name: r
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  r:
    permissions: { contents: read }
    uses: NDDev-Technocracy-Archive/ci-workflows-20261014/.github/workflows/r-ci.yml@<sha>
    with:
      runner: ubuntu-latest
      lint: true
      test_command: "Rscript -e 'testthat::test_local()'"

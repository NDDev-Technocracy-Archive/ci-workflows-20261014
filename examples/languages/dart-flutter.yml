# Dart/Flutter CI caller (any tier). Replace @<sha> with a pinned full commit SHA.
name: dart-flutter
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  dart-flutter:
    permissions: { contents: read }
    uses: NDDev-Technocracy-Archive/ci-workflows-20261014/.github/workflows/dart-flutter-ci.yml@<sha>
    with:
      runner: ubuntu-latest
      flutter_channel: stable
      # Pin an exact release for reproducible evidence; omit to follow stable.
      flutter_version: '3.47.0'

# Java CI caller (any tier). Replace @<sha> with a pinned full commit SHA.
name: java
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  java:
    permissions: { contents: read }
    uses: NDDev-Technocracy-OpenNetwork/ci-workflows/.github/workflows/java-ci.yml@<sha>
    with:
      runner: ubuntu-latest
      test_command: 'mvn -B verify'

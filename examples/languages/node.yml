# Node.js CI caller (any tier). Replace @<sha> with a pinned full commit SHA.
name: node
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  node:
    permissions: { contents: read }
    uses: NDDev-Technocracy-Sandbox/ci-workflows/.github/workflows/node-ci.yml@<sha>
    with:
      runner: ubuntu-latest
      package_manager: bun
      test_command: 'bun test'
      # npm/pnpm/Yarn callers may set cache to the same package_manager and
      # cache_dependency_path to the repository's lockfile. Bun owns no
      # setup-node cache and must leave both inputs empty.

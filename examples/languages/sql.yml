# SQL CI caller (any tier). Replace @<sha> with a pinned full commit SHA.
name: sql
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  sql:
    permissions: { contents: read }
    uses: NDDev-Technocracy-Archive/ci-workflows-20261014/.github/workflows/sql-ci.yml@<sha>
    with:
      runner: ubuntu-latest
      dialect: postgres
      paths: 'migrations'

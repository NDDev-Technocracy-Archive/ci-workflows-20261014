# Kotlin/Android CI caller (any tier). Replace @<sha> with a pinned full commit SHA.
name: kotlin-android
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  kotlin-android:
    permissions: { contents: read }
    uses: NDDev-Technocracy-OpenNetwork/ci-workflows/.github/workflows/kotlin-android-ci.yml@<sha>
    with:
      runner: ubuntu-latest
      # The checked wrapper drives the default `./gradlew build` contract.
      java_version: '21'

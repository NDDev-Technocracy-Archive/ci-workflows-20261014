# Each security call uses a fresh implementation directory and verifies that
# the selected Git history is available before scanning.
# If artifact storage is unavailable, complete redacted reports are preserved
# as a checksummed ZIP in the security evidence fallback step log.
# Private repository WITH GitHub Code Security, on a caller-owned self-hosted
# label. This is an explicit paid opt-in: zizmor keeps SARIF upload. Callers
# without Code Security must use examples/private-free/security-selfhosted.yml
# instead. Do not copy this file into a public repository.
# Replace `private-ci` with an isolated ephemeral runner label registered only
# to private repositories. Replace @<sha> with a pinned full commit SHA.
name: security
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  security-bundle:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: NDDev-Technocracy-Sandbox/ci-workflows/.github/workflows/nddev-security-bundle.yml@<sha>
    with:
      runner: private-ci

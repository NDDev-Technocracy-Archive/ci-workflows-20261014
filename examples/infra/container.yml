# Container/filesystem Trivy scan caller (any tier). Replace @<sha>.
name: container
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  container:
    permissions: { contents: read }
    uses: NDDev-Technocracy-OpenNetwork/ci-workflows/.github/workflows/container-ci.yml@<sha>
    with:
      runner: ubuntu-latest
      scan_type: fs
      scan_ref: '.'
      severity: 'CRITICAL,HIGH'

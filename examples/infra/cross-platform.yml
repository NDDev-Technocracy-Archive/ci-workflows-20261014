# Cross-platform smoke test caller (any tier). The callee isolates global Git
# config independently on every runner lane. Replace @<sha>.
name: cross-platform
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  smoke:
    permissions: { contents: read }
    uses: NDDev-Technocracy-OpenNetwork/ci-workflows/.github/workflows/cross-platform-smoke.yml@<sha>
    with:
      os_list: '["ubuntu-latest","macos-latest","windows-latest"]'
      # Optional: runs on every OS before the smoke command. A failure here is
      # reported as an install failure, not as a smoke failure.
      install_command: 'python -m pip install --require-hashes -r requirements-ci.txt'
      command: 'python -c "import sys; print(sys.platform)"'

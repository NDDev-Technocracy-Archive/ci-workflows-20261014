# Terraform fmt/init/validate caller (any tier). Replace @<sha>.
name: terraform
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  terraform:
    permissions: { contents: read }
    uses: NDDev-Technocracy-Archive/ci-workflows-20261014/.github/workflows/terraform-ci.yml@<sha>
    with:
      runner: ubuntu-latest
      terraform_version: '1.13.0'   # pin for reproducible CI
      working_directory: infra

# Checkov IaC scan caller (any tier). Replace @<sha>.
name: iac-scan
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  iac-scan:
    permissions: { contents: read }
    uses: NDDev-Technocracy-Sandbox/ci-workflows/.github/workflows/iac-scan.yml@<sha>
    with:
      runner: ubuntu-latest
      framework: terraform

# OSV-Scanner SCA caller (any tier — free on private-free). Replace @<sha>.
name: osv-scan
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  osv-scan:
    permissions: { contents: read }
    uses: NDDev-Technocracy-OpenNetwork/ci-workflows/.github/workflows/osv-scan.yml@<sha>
    with:
      runner: ubuntu-latest
      scan_args: '--recursive .'

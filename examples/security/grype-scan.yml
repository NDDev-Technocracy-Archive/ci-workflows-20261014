# Grype SCA caller (any tier — free on private-free). Replace @<sha>.
name: grype-scan
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  grype:
    permissions: { contents: read }
    uses: NDDev-Technocracy-OpenNetwork/ci-workflows/.github/workflows/grype-scan.yml@<sha>
    with:
      runner: ubuntu-latest
      severity_cutoff: high

# cargo-deny + cargo-audit + cargo-machete for a Rust crate or workspace.
#
# `runner: ubuntu-latest` is stated explicitly: the reusables default `runner`
# to a private self-hosted label, and a default belongs to the pinned commit,
# not to you. A pin bump must never be able to move your build onto
# infrastructure you did not choose.
name: rust-supply-chain
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  schedule:
    # Advisories land continuously; a weekly sweep catches one that appeared
    # after the last commit.
    - cron: "17 4 * * 2"
permissions: {}
jobs:
  supply-chain:
    permissions: { contents: read }
    uses: NDDev-Technocracy-Sandbox/ci-workflows/.github/workflows/rust-supply-chain.yml@<sha>
    with:
      runner: ubuntu-latest
      # Optional: route only cargo-deny to a different caller-selected pool.
      # All checks run natively; Docker is not required.
      # deny_runner: nddev-linux
      toolchain: stable
      enable_deny: true
      enable_audit: true
      enable_machete: true
      # All three tools resolve the same crate/workspace from this directory.
      working_directory: .
      # Point at your reviewed cargo-deny policy when it is not at repository root.
      deny_arguments: '--all-features --config deny.toml'
      deny_command: "check bans licenses advisories sources"

# hadolint Dockerfile lint caller (any tier). Replace @<sha>.
name: hadolint
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  hadolint:
    permissions: { contents: read }
    uses: NDDev-Technocracy-Archive/ci-workflows-20261014/.github/workflows/hadolint-ci.yml@<sha>
    with:
      runner: ubuntu-latest
      recursive: true

# Semgrep OSS SAST caller (any tier — free on private-free). Replace @<sha>.
name: semgrep
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  semgrep:
    permissions: { contents: read }
    uses: NDDev-Technocracy-Sandbox/ci-workflows/.github/workflows/semgrep-ci.yml@<sha>
    with:
      runner: ubuntu-latest
      config: p/ci

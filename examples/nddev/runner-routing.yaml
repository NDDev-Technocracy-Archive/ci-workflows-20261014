# Example operator mapping for private repositories that compile a runner
# before dispatch. This is caller-owned data, not a reusable-workflow default
# and not a live fleet inventory. GitHub will not fall back after a
# self-hosted label has entered the queue.
schema: nddev-ci-runner-map/v1
fleet_contract:
  repository: NDDev-Technocracy-OpenNetwork/github-actions-light
  minimum_contract_version: 1
  worker_kind: official-actions-runner
  ephemeral: false
  jobs_per_worker: 1
  executed_worker_disposition: persist
routes:
  linux:
    hosted:
      runner: ubuntu-latest
      backend: github-hosted-standard
      capabilities: [container-runtime]
    fast:
      runner: nddev-linux
      backend: self-hosted
      capabilities: []
    standard:
      runner: nddev-linux
      backend: self-hosted
      capabilities: []
    integration:
      runner: nddev-linux
      backend: self-hosted
      capabilities: [container-runtime]
  macos:
    hosted:
      runner: macos-latest
      backend: github-hosted-standard
      capabilities: []
  windows:
    hosted:
      runner: windows-latest
      backend: github-hosted-standard
      capabilities: []

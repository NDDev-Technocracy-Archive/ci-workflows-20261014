# Publisher-org public caller: the free public security surfaces (CodeQL, SARIF,
# dependency review, gitleaks, actionlint, OSV). These are free on public
# repositories on every current GitHub plan; they are not a claim that the
# publisher purchased Code Security, Secret Protection, Code Quality, or
# Enterprise Cloud. Private repositories without those purchases must not copy
# this file — use examples/private-free/ or security-private-selfhosted.yml.
# Replace @<sha> with a pinned full commit SHA of ci-workflows.
name: security
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  codeql:
    permissions: { actions: read, contents: read, security-events: write }
    uses: NDDev-Technocracy-Archive/ci-workflows-20261014/.github/workflows/public-codeql.yml@<sha>
    with:
      runner: ubuntu-latest
      dependabot_runner: ubuntu-latest
      languages: '["python","actions"]'
  secret-scan:
    permissions: { contents: read }
    uses: NDDev-Technocracy-Archive/ci-workflows-20261014/.github/workflows/secret-scan.yml@<sha>
    with:
      runner: ubuntu-latest
  actionlint:
    permissions: { contents: read }
    uses: NDDev-Technocracy-Archive/ci-workflows-20261014/.github/workflows/actionlint.yml@<sha>
    with:
      runner: ubuntu-latest
  zizmor:
    permissions: { actions: read, contents: read, security-events: write }
    uses: NDDev-Technocracy-Archive/ci-workflows-20261014/.github/workflows/zizmor-sarif.yml@<sha>
    with:
      runner: ubuntu-latest
  dependency-review:
    permissions: { contents: read, pull-requests: write }
    uses: NDDev-Technocracy-Archive/ci-workflows-20261014/.github/workflows/public-dependency-review.yml@<sha>
    with:
      runner: ubuntu-latest
  osv-scan:
    permissions: { contents: read }
    uses: NDDev-Technocracy-Archive/ci-workflows-20261014/.github/workflows/osv-scan.yml@<sha>
    with:
      runner: ubuntu-latest

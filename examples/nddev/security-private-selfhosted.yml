# Publisher-org PRIVATE repository variant without paid GitHub add-ons.
#
# Same surfaces as examples/private-free/security-selfhosted.yml: the free
# private bundle (actionlint, zizmor without SARIF, OSV, gitleaks) plus
# private-static. No CodeQL, no SARIF upload, no dependency review — those
# need Code Security on private repositories and are not assumed here.
# Release provenance for this shape is release-supply-chain-free.yml.
#
# Do NOT copy this file into a public repository. A forked pull request against
# a public repo executes attacker-controlled code, so pointing a public repo at a
# self-hosted runner is a remote-code-execution path into your own hardware.
# A private runner group should also set allows_public_repositories: false as a
# backstop, not as the control.
#
# Replace @<sha> with a pinned full commit SHA of ci-workflows. Replace the
# runner labels with isolated ephemeral labels registered only to private
# repositories. Destroy the worker after one job. This file does not publish a
# live fleet inventory.
name: security
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  security-bundle:
    permissions: { contents: read }
    uses: NDDev-Technocracy-Sandbox/ci-workflows/.github/workflows/private-security-bundle-free.yml@<sha>
    with:
      runner: nddev-linux
  validate:
    permissions: { contents: read }
    uses: NDDev-Technocracy-Sandbox/ci-workflows/.github/workflows/private-static.yml@<sha>
    with:
      runner: nddev-linux
      command: "python3 scripts/validate_all.py"
